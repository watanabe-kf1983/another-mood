[project]
name = "another-mood"
dynamic = ["version"]
description = "A processor of source-based databases, keeping related documents in sync."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "filelock>=3.25.2",
    "hugo>=0.162.0",
    "markdown-it-py>=4.0.0",
    "markupsafe>=3.0.3",
    "mcp>=1.28.1",
    "minijinja>=2.21.0",
    "packaging>=26.0",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0",
    "regex>=2026.4.4",
    "ruamel-yaml>=0.19.1",
    "typer>=0.24.1",
    "watchdog>=6.0.0",
]

[project.scripts]
mood = "another_mood.cli:main"
mood-mcp = "another_mood.mcp_server:main"

[project.urls]
Homepage = "https://github.com/watanabe-kf1983/another-mood"
Repository = "https://github.com/watanabe-kf1983/another-mood"
Issues = "https://github.com/watanabe-kf1983/another-mood/issues"
Documentation = "https://github.com/watanabe-kf1983/another-mood/blob/main/docs/index.md"
# PyPI has no surface of its own for release notes, so the project page links
# out to the GitHub Releases ledger.
Changelog = "https://github.com/watanabe-kf1983/another-mood/releases"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

# `git describe` picks the nearest reachable tag, so marker tags that are not
# releases (v0-ts-baseline and the like) would otherwise be read as versions.
# The filter has to sit here, on the describe command: hatch-vcs's tag-pattern
# only validates the tag already chosen, which turns a stray tag into a build
# failure instead of skipping it. The globs keep tags shaped vN.N.N and drop
# everything carrying a suffix; the rest mirrors the upstream default command.
[tool.hatch.version.raw-options.scm.git]
describe_command = [
    "git",
    "describe",
    "--dirty",
    "--tags",
    "--long",
    "--abbrev=40",
    "--match",
    "v[0-9]*.[0-9]*.[0-9]*",
    "--exclude",
    "*-*",
]

# The version now moves with git state, but an editable install's recorded
# metadata does not — `importlib.metadata.version` would keep reporting the
# version stamped at install time. Adding the git key makes uv reinstall when
# the commit or the tags move. Listing pyproject.toml too because naming any
# cache key replaces uv's default rather than extending it.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pre-commit>=4.5.1",
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "ruamel-yaml>=0.19.1",
    "ruff>=0.15.7",
    "types-jsonschema>=4.26.0.20260325",
]

[tool.hatch.build.targets.wheel.force-include]
"showcase" = "another_mood/_showcase"
"docs" = "another_mood/_docs"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["another_mood.components"]
branch = true

[tool.pyright]
typeCheckingMode = "strict"
# Check against the declared floor rather than whichever interpreter happens
# to be active, so a 3.13-only API is caught locally and in every CI job.
pythonVersion = "3.12"

[tool.ruff.lint]
# preview is enabled solely to opt into PLW1514, which is still preview-gated
# in ruff 0.15.x. `select` is given explicitly (not extend-select) because
# preview mode otherwise pulls in preview-tier defaults from categories we
# haven't opted into (I, DTZ, etc.).
preview = true
select = [
    "E4", "E7", "E9",  # pycodestyle defaults
    "F",               # pyflakes default
    "T20",             # flake8-print: forbid print() / pprint()
    "PLW1514",         # require explicit encoding= on open() / read_text / write_text
]

# CLI is the boundary that turns business-logic return values into terminal
# output, so it is the only production module allowed to call print().
# Tests may print for ad-hoc debugging, and the repo's own CI scripts talk to
# their runner over stdout.
[tool.ruff.lint.per-file-ignores]
"src/another_mood/cli.py" = ["T201"]
"tests/**/*.py" = ["T201"]
"scripts/**/*.py" = ["T201"]
