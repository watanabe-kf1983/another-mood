title: ReportsSchema
description: >-
  Validates the user's definition/reports.yaml. The file
  configures report output. Two mutually exclusive forms: form A declares
  a single edition's settings at the top level (file_per, vars); form B
  declares an editions map — one named edition per entry, each with its
  own settings. Mixing the two (a top-level file_per or vars alongside
  editions) is rejected.

oneOf:
  - $ref: "#/$defs/formA"
  - $ref: "#/$defs/formB"

$defs:
  typeId:
    title: Type ID
    description: >-
      Dotted type ID — segments separated by `.`, each segment
      is a Unicode identifier. A record type ends in `.item` (e.g.
      `erds.item.entities.item`); the array *of* those records takes a
      trailing `[]` (e.g. `erds.item.entities.item[]`).
    type: string
    pattern: "^[\\p{L}_][\\p{L}\\p{M}\\p{N}_]*(\\.[\\p{L}_][\\p{L}\\p{M}\\p{N}_]*)*(\\[\\])?$"

  filePerList:
    title: file_per list
    description: >-
      Type IDs whose nodes are split out as separate files by the
      generator — read as "one file per instance of these types".
      An empty list (or omitted file_per:) means "no splitting —
      everything inlines into a single index.md". Each entry is matched
      verbatim against the type ID the generator resolved for a
      node — no prefixes, no patterns; the database pages under
      __db/__defs/entities/ and __db/__defs/views/ show the exact values.
    type: array
    items:
      $ref: "#/$defs/typeId"

  varsMap:
    title: vars map
    description: >-
      Values templates read back as build_info("vars.NAME") while
      rendering this edition. A value injected under the same name
      (--var, MOOD_VARS_*) wins.
    type: object
    propertyNames:
      minLength: 1
    additionalProperties:
      type: [string, number, boolean]

  formA:
    title: Single-edition report (form A)
    description: >-
      Top-level file_per: the report is published as one implicit edition
      named `default`, under {outDir}/default/.
    type: object
    properties:
      file_per:
        $ref: "#/$defs/filePerList"
      vars:
        $ref: "#/$defs/varsMap"
    additionalProperties: false

  formB:
    title: Multi-edition report (form B)
    description: >-
      An editions map: each entry is one edition — a body variant of the
      same report, published side by side under {outDir}/{edition}/. Every
      edition renders the same data through the same templates; they
      differ in file_per (split granularity) and in vars (values the
      templates read back).
    type: object
    required: [editions]
    properties:
      editions:
        type: object
        minProperties: 1
        propertyNames:
          description: >-
            Edition name — any non-empty string, used as the output
            subdirectory segment (IRI-escaped when it carries unsafe
            characters). Names starting with `__` are reserved for the
            tool's own output (`__db/`, `__warnings/`,
            `__build_info/`) and rejected.
          pattern: "^(?!__).+$"
        additionalProperties:
          title: Edition
          description: One edition's output configuration — same shape as form A's top level.
          type: object
          properties:
            file_per:
              $ref: "#/$defs/filePerList"
            vars:
              $ref: "#/$defs/varsMap"
          additionalProperties: false
    additionalProperties: false
