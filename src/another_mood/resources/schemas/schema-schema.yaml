# $ref / $defs are used here for recursion, but are not available to
# user-defined schemas (only the keywords listed under jsonSchemaSubset are).

title: SchemaSchema
description: >-
  Meta-schema validating the user's definition/schema.yaml. The accepted
  language is a curated subset of JSON Schema draft 2020-12: the root must
  be an object with `properties:` enumerating each top-level entity, and
  only the keywords listed under jsonSchemaSubset are permitted. See
  docs/reference/schema.md for the prose specification.

$ref: "#/$defs/rootSchema"

$defs:
  rootSchema:
    title: Root schema constraints
    description: >-
      Constraints applied only at the root of the user's schema.yaml: it
      must be `type: object` and define `properties:`. A map-pattern root
      (additionalProperties without properties) is rejected because it
      would yield no entity to normalize.
    allOf:
      - $ref: "#/$defs/jsonSchemaSubset"
      - required: [properties]
        properties:
          type:
            const: object
          properties:
            propertyNames:
              description: >-
                Entity names must not start with `__`: that prefix is
                reserved for built-in sources (`__definition.*` and the
                built-in views), which share one source namespace with
                user entities and views. Applies to top-level entity
                names only; the general identifier pattern for every
                nesting level lives in jsonSchemaSubset.
              pattern: "^(?!__)"

  xRef:
    title: x-ref foreign-key declaration
    description: >-
      Structured foreign-key reference. `entity` is the target
      top-level entity id; `attribute` (optional) is the target
      attribute name. When `attribute` is omitted, the synthetic
      `.id` of a dict-pattern target entity is assumed. May only
      appear on properties whose `type` is `string`. See
      docs/reference/schema.md for the prose specification.
    type: object
    required: [entity]
    additionalProperties: false
    properties:
      entity: { type: string }
      attribute: { type: string }

  jsonValue:
    title: JSON value
    description: >-
      Any value the JSON data model can express. Constrains the interior
      of an object or array literal, where the declared type says nothing
      about the contents.
    # Nested if/then/else rather than the equivalent anyOf, which
    # collapses the diagnostic to "is not valid under any of the given
    # schemas".
    if: { type: array }
    then:
      items: { $ref: "#/$defs/jsonValue" }
    else:
      if: { type: object }
      then:
        additionalProperties: { $ref: "#/$defs/jsonValue" }
      else:
        type: [string, number, integer, boolean, "null"]

  jsonArray:
    title: JSON array literal
    type: array
    items: { $ref: "#/$defs/jsonValue" }

  jsonObject:
    title: JSON object literal
    type: object
    additionalProperties: { $ref: "#/$defs/jsonValue" }

  jsonSchemaSubset:
    title: Accepted JSON Schema subset
    description: >-
      Recursive subset of JSON Schema draft 2020-12 keywords accepted at
      every level of the user's schema. Structural keywords (type,
      properties, additionalProperties, items) are interpreted by the
      normalizer; validation, meta-data, and format keywords are passed
      through to the jsonschema library unchanged.
    type: object
    required: [type]
    properties:
      # --- Structural keywords (interpreted by this project) ---
      type:
        description: >-
          Single primitive type only. JSON Schema's array form
          (e.g. `[string, "null"]`) and the `null` type are rejected by
          design.
        type: string
        enum: [object, array, string, number, integer, boolean]
      properties:
        description: >-
          Fixed-structure object definition. When present at the same
          level, `additionalProperties: false` is required (see the
          `if`/`then` clause at the bottom); the map pattern
          (`additionalProperties: <schema>`) cannot be combined here.
        type: object
        propertyNames:
          description: >-
            Identifier pattern for property names: starts with a Unicode
            letter or underscore, followed by Unicode letters, digits, or
            underscores.
          pattern: "^[\\p{L}_][\\p{L}\\p{N}_]*$"
        additionalProperties:
          $ref: "#/$defs/jsonSchemaSubset"
      additionalProperties:
        description: >-
          Map-pattern signal. When set to a schema object, the value is
          a homogeneous map that the normalizer converts into an array.
          When set to `false`, no extra keys are allowed (required when
          `properties:` is present at the same level).
        anyOf:
          - $ref: "#/$defs/jsonSchemaSubset"
          - const: false
      items:
        description: >-
          Schema applied to each element of an array. `x-ref` directly
          on the items schema is rejected because the data catalog does
          not carry scalar-array-element metadata; FK on scalar array
          elements is not supported at this stage. `x-ref` on regular
          properties nested under `items:` (e.g. `items.properties.foo`)
          remains accepted.
        allOf:
          - $ref: "#/$defs/jsonSchemaSubset"
          - not:
              required: [x-ref]

      # --- Foreign-key reference (Another Mood extension) ---
      x-ref:
        $ref: "#/$defs/xRef"

      # --- Validation keywords (pass-through to jsonschema) ---
      required:
        type: array
        items: { type: string }
        uniqueItems: true
      enum:
        type: array
        minItems: 1
      const: {}
      minimum: { type: number }
      maximum: { type: number }
      exclusiveMinimum: { type: number }
      exclusiveMaximum: { type: number }
      multipleOf: { type: number, exclusiveMinimum: 0 }
      minLength: { type: integer, minimum: 0 }
      maxLength: { type: integer, minimum: 0 }
      pattern: { type: string }
      minItems: { type: integer, minimum: 0 }
      maxItems: { type: integer, minimum: 0 }
      uniqueItems: { type: boolean }
      # --- Meta-data keywords (pass-through) ---
      title: { type: string }
      description: { type: string }
      default: {}
      examples: { type: array }
      deprecated: { type: boolean }
      readOnly: { type: boolean }
      writeOnly: { type: boolean }

      # --- Format annotation (pass-through) ---
      format: { type: string }

    additionalProperties: false

    # `x-ref` (FK declaration) is only allowed on string-typed properties.
    # Target attribute values are compared as strings, and the synthetic id
    # derived from a dict-pattern key is always a string. Allowing `x-ref` on
    # other primitive types would silently no-op (array/object) or invite
    # type-mismatch confusion; reject them at the meta-schema level instead.
    dependentSchemas:
      x-ref:
        properties:
          type:
            const: string

    # Literal values must agree with the declared `type`. JSON Schema does
    # not check this itself — `{type: string, const: 5}` is a valid (merely
    # unsatisfiable) schema, and `default` / `examples` are annotations the
    # spec leaves unvalidated — but here a mismatch is always an authoring
    # error, and it is the path by which a YAML date reaches the pipeline.
    # Only the outer type is checkable: validating a literal against its
    # sibling schema would mean applying a schema to itself, which JSON
    # Schema cannot express. Hence `jsonValue` for the interior of object
    # and array literals.
    allOf:
      - if: { required: [type], properties: { type: { const: string } } }
        then:
          properties:
            default: { type: string }
            const: { type: string }
            enum: { items: { type: string } }
            examples: { items: { type: string } }
      - if: { required: [type], properties: { type: { const: number } } }
        then:
          properties:
            default: { type: number }
            const: { type: number }
            enum: { items: { type: number } }
            examples: { items: { type: number } }
      - if: { required: [type], properties: { type: { const: integer } } }
        then:
          properties:
            default: { type: integer }
            const: { type: integer }
            enum: { items: { type: integer } }
            examples: { items: { type: integer } }
      - if: { required: [type], properties: { type: { const: boolean } } }
        then:
          properties:
            default: { type: boolean }
            const: { type: boolean }
            enum: { items: { type: boolean } }
            examples: { items: { type: boolean } }
      - if: { required: [type], properties: { type: { const: array } } }
        then:
          properties:
            default: { $ref: "#/$defs/jsonArray" }
            const: { $ref: "#/$defs/jsonArray" }
            enum: { items: { $ref: "#/$defs/jsonArray" } }
            examples: { items: { $ref: "#/$defs/jsonArray" } }
      - if: { required: [type], properties: { type: { const: object } } }
        then:
          properties:
            default: { $ref: "#/$defs/jsonObject" }
            const: { $ref: "#/$defs/jsonObject" }
            enum: { items: { $ref: "#/$defs/jsonObject" } }
            examples: { items: { $ref: "#/$defs/jsonObject" } }

    # When `properties:` is present at the same level, `additionalProperties: false`
    # becomes required. Without `properties:`, `additionalProperties` may be a schema
    # object (the map pattern that drives map-to-array normalization).
    if:
      required: [properties]
    then:
      properties:
        additionalProperties:
          const: false
      required: [additionalProperties]
