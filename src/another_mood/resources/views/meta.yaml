# Built-in meta diagnostic views, rendered by the meta templates into
# `__db/`.  Ids starting with `__` are catalog-internal (e.g.
# __definition.*) and are filtered out so their internals do not clutter
# the user's diagnostics.

# Every user content entity, children included — the node set of the ER
# diagram.  A helper, not paged (absent from META_EDITION's file_per);
# `entities` below narrows it to the top level.
__defs.entity_tree:
  from: __definition.entities
  where:
    view: false
    not:
      id: { startswith: __ }
  select:
    - item: id
    - item: parent_entity
    - item: builtin
    - item: metadata
    - item: item_type

# The root entity, whose attributes are the top-level singletons and scalars.
__defs.root:
  from: __definition.entities
  where:
    id: __root
  select:
    - item: id
    - item: metadata
    - item: item_type

# The top-level content entities, user-authored and user-facing built-ins
# like `prose`.
__defs.entities:
  from: __defs.entity_tree
  where:
    parent_entity: __root
  select:
    - item: id
    - item: builtin
    - item: metadata
    - item: item_type
  sort: { by: builtin }

# The user-defined views, passed through whole so the template can spell
# each query (from / flatten / join / where / grouped / select).
__defs.views:
  from: __definition.views
  where:
    not:
      id: { startswith: __ }

# The data pages mirror the definition pages one to one: each is the id
# projection of its __defs counterpart, so the two sides can never list
# different sources.
__data.root:
  from: __defs.root
  select:
    - item: id

__data.entities:
  from: __defs.entities
  select:
    - item: id

__data.views:
  from: __defs.views
  select:
    - item: id
