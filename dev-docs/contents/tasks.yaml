        title: 未解決リンク参照のビルドレポート警告 (link / relink 共通)
        note: >-
          link / href (B4) と relink (B5) は未解決参照 (MissingNode / 解決できない node: URL) を
          `[text]` で可視化するのみで BuildReport には積まない。author が壊れた参照に気づけるよう、
          未解決参照を収集して D7 の警告インフラに載せ、ビルドレポートに出す。両フィルタ共通の経路で
          一度に扱う。現契約 (可視化はするが報告はしない) は anchor-spec.md#未解決参照の扱い。
          現状でも表示テキストは残り可視なので優先度低。
          ただし可視性は出力を目で読む場面でしか効かない。W4 の dev-docs 整理では節の削除・移動で
          裸になった `[text]` に気づけず、ソースと出力を突き合わせる検査を別途書いて見つけた。
        phase: 20
        proposal: 20-design/70-generator/30-anchor-spec#未決事項
