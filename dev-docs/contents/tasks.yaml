          components がフラットなレコード、dependencies が bom-ref を張る FK
          グラフ、SPDX ライセンス付き) を生成し、封筒 (bomFormat 等のメタデータ
          キー) を jq で剥がして dev-docs の contents に置く。再生成を CI 工程に
          組み込み、依存の追加が次のビルドでライセンス台帳 (license で group する
          view) とコンポーネント別ページに自動反映される状態にする。
          M11 (入力形式に JSON を追加) が前提。「機械的ワンショット出力の contents
          流用」という JSON 入口の位置づけの実証で、well-known 方言向け import
          blueprint (筆頭候補 CycloneDX) 構想の前身を兼ねる。uv 本体に sbom
          コマンドは無く、cyclonedx-bom パッケージを uvx で叩く (requirements
          経由は情報が痩せるので environment モードを使う)。
          論点: dependsOn (bom-ref の文字列配列) を view の join で辿れるか
          (x-ref は整合性検査なので配列対応は不要、問題は join の側)。
