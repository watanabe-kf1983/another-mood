name: Release

# A release is a tag push and nothing else — main carries no release commit,
# so this workflow has no counterpart triggered by a branch. The tag patterns
# mirror the describe filter in pyproject.toml, keeping the workflow and the
# version derivation in agreement on what counts as a release tag.
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "!*-*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The version is derived from the nearest release tag, which the
          # default shallow clone does not fetch.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - run: uv build

      # The version is derived rather than declared, so a regression in the
      # clone depth or the describe filter yields a development version under
      # a release tag with nothing downstream to notice. Checking it here, at
      # the point of derivation, keeps that failure from reaching a package
      # index where the number cannot be reclaimed.
      - name: Check the built version against the tag
        run: |
          expected="dist/another_mood-${GITHUB_REF_NAME#v}.tar.gz"
          if [ ! -f "$expected" ]; then
            echo "::error::expected $expected, built $(ls dist | tr '\n' ' ')"
            exit 1
          fi

      # Not a release asset — the distribution channel is the package index
      # alone. Kept for the run page, where the artifact of a release is worth
      # being able to fetch and inspect.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Ordered before the GitHub Release because the two differ in reversibility:
  # a release and its tag can be deleted and cut again under the same number,
  # while a version published to the index is burned for good. Stopping here on
  # failure leaves the tag re-cuttable.
  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    # Authentication is trusted publishing, so the token is minted per run from
    # this job's identity and no secret is stored. The environment is half of
    # what the index matches that identity against; the other half is the name
    # of this workflow file. Its deployment rule admits release tags alone,
    # which is what keeps an edited copy of this workflow on a branch from
    # reaching the index.
    environment: pypi
    permissions:
      id-token: write
    steps:
      # Publishing the artifact the build job checked, rather than building
      # again, keeps the version check upstream binding.
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.2

  github-release:
    needs: pypi-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout: `gh release create` addresses the repository over the API,
      # and the notes are generated on GitHub's side from the pull requests
      # merged since the previous release.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
