name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Both ends of the supported range: the floor declared by
      # requires-python, and the newest version most users will install on.
      # setup-uv exports UV_PYTHON, which outranks the .python-version file.
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          # The version is derived from the nearest release tag, which the
          # default shallow clone does not fetch.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv sync --locked

      - run: make ci

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: reports/
          retention-days: 30
