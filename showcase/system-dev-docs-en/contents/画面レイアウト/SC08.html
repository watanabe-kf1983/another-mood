<!doctype html>
<meta charset="utf-8">
<title>保留販売確認画面</title>
<link rel="stylesheet" href="wireframe.css">

<!-- 確認待ちの販売を識別するのは通知日時だけなので、上の表は 1 列になる。 -->
<main>
  <h1>保留販売確認画面</h1>
  <section>

    <h2>確認待ちの販売</h2>

    <table>
      <colgroup>
        <col style="width: 200px">
      </colgroup>
      <thead>
        <tr><th>通知日時</th></tr>
      </thead>
      <tbody>
        <tr><td></td></tr>
        <tr><td></td></tr>
      </tbody>
    </table>

    <h2>明細</h2>

    <table>
      <colgroup>
        <col style="width: 170px">
        <col style="width: 70px">
        <col style="width: 170px">
        <col style="width: 240px">
      </colgroup>
      <thead>
        <tr><th>通知ISBN</th><th>数量</th><th>ISBN</th><th>書名</th></tr>
      </thead>
      <tbody>
        <tr><td></td><td></td><td><input></td><td></td></tr>
        <tr><td></td><td></td><td><input></td><td></td></tr>
      </tbody>
    </table>

    <footer>
      <button>確認を確定する</button>
      <button>メニューへ戻る</button>
    </footer>

    <aside>
      <input> 入力
      <input readonly> 出力
    </aside>

  </section>
</main>
