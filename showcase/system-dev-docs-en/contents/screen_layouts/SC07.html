<!doctype html>
<meta charset="utf-8">
<title>Book history screen</title>
<link rel="stylesheet" href="wireframe.css">

<main>
  <h1>Book history screen</h1>
  <section>

    <div><label>ISBN <input readonly size="16"></label></div>
    <div><label>Title <input readonly size="28"></label></div>
    <div><label>Publisher <input readonly size="20"></label></div>
    <div><label>Stock quantity <input readonly size="6"></label></div>

    <h2>History</h2>

    <table>
      <colgroup>
        <col style="width: 170px">
        <col style="width: 120px">
        <col style="width: 90px">
      </colgroup>
      <thead>
        <tr><th>Date</th><th>Kind</th><th>Quantity</th></tr>
      </thead>
      <tbody>
        <tr><td></td><td></td><td></td></tr>
        <tr><td></td><td></td><td></td></tr>
        <tr><td></td><td></td><td></td></tr>
      </tbody>
    </table>

    <footer>
      <button>Back to list</button>
    </footer>

    <aside>
      <input> Input
      <input readonly> Output
    </aside>

  </section>
</main>
