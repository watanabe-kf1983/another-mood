<!doctype html>
<meta charset="utf-8">
<title>書籍履歴画面</title>
<link rel="stylesheet" href="wireframe.css">

<main>
  <h1>書籍履歴画面</h1>

    <div><label>ISBN <input readonly size="16"></label></div>
    <div><label>書名 <input readonly size="28"></label></div>

    <table>

        <col style="width: 90px">
      </colgroup>
      <thead>
        <tr><th>日時</th><th>種別</th><th>数量</th></tr>
      </thead>
      <tbody>
        <tr><td></td><td></td><td></td></tr>
        <tr><td></td><td></td><td></td></tr>
        <tr><td></td><td></td><td></td></tr>
      </tbody>
    </table>

    <footer>
      <button>一覧へ戻る</button>
    </footer>

    <aside>
      <input> 入力
      <input readonly> 出力
    </aside>

  </section>
</main>
