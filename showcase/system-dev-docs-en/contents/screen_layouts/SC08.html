<!doctype html>
<meta charset="utf-8">
<title>Pending sale review screen</title>
<link rel="stylesheet" href="wireframe.css">

<!-- A sale awaiting review is identified by its notification time alone, so the upper table has one column. -->
<main>
  <h1>Pending sale review screen</h1>
  <section>

    <h2>Sales awaiting review</h2>

    <table>
      <colgroup>
        <col style="width: 200px">
      </colgroup>
      <thead>
        <tr><th>Notified at</th></tr>
      </thead>
      <tbody>
        <tr><td></td></tr>
        <tr><td></td></tr>
      </tbody>
    </table>

    <h2>Lines</h2>

    <table>
      <colgroup>
        <col style="width: 170px">
        <col style="width: 70px">
        <col style="width: 170px">
        <col style="width: 240px">
      </colgroup>
      <thead>
        <tr><th>Notified ISBN</th><th>Quantity</th><th>ISBN</th><th>Title</th></tr>
      </thead>
      <tbody>
        <tr><td></td><td></td><td><input></td><td></td></tr>
        <tr><td></td><td></td><td><input></td><td></td></tr>
      </tbody>
    </table>

    <footer>
      <button>Confirm review</button>
      <button>Back to menu</button>
    </footer>

    <aside>
      <input> Input
      <input readonly> Output
    </aside>

  </section>
</main>
