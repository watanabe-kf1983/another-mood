<!doctype html>
<meta charset="utf-8">
<title>入荷登録画面</title>
<link rel="stylesheet" href="wireframe.css">

<main>
  <h1>入荷登録画面</h1>
  <section>

    <div>
      <label>仕入先 <select></select></label>
      <label>入荷日時 <input readonly size="16"></label>
    </div>

    <h2>明細</h2>

    <div>
      <label>ISBN <input size="16"></label>
      <label>書名 <input readonly size="16"></label>
      <label>数量 <input size="6"></label>
      <button>明細を追加する</button>
    </div>

    <table>
      <colgroup>
        <col style="width: 170px">
        <col style="width: 280px">
        <col style="width: 90px">
      </colgroup>
      <thead>
        <tr><th>ISBN</th><th>書名</th><th>数量</th></tr>
      </thead>
      <tbody>
        <tr><td></td><td></td><td></td></tr>
        <tr><td></td><td></td><td></td></tr>
      </tbody>
    </table>

    <footer>
      <button>確定する</button>
      <button>メニューへ戻る</button>
    </footer>

    <aside>
      <input> 入力
      <input readonly> 出力
    </aside>

  </section>
</main>
