<!doctype html>
<meta charset="utf-8">
<title>Delivery registration screen</title>
<link rel="stylesheet" href="wireframe.css">

<main>
  <h1>Delivery registration screen</h1>
  <section>

    <div>
      <label>Supplier <select></select></label>
      <label>Delivered at <input readonly size="16"></label>
    </div>

    <h2>Lines</h2>

    <div>
      <label>ISBN <input size="16"></label>
      <label>Title <input readonly size="16"></label>
      <label>Quantity <input size="6"></label>
      <button>Add line</button>
    </div>

    <table>
      <colgroup>
        <col style="width: 170px">
        <col style="width: 280px">
        <col style="width: 90px">
      </colgroup>
      <thead>
        <tr><th>ISBN</th><th>Title</th><th>Quantity</th></tr>
      </thead>
      <tbody>
        <tr><td></td><td></td><td></td></tr>
        <tr><td></td><td></td><td></td></tr>
      </tbody>
    </table>

    <footer>
      <button>Confirm</button>
      <button>Back to menu</button>
    </footer>

    <aside>
      <input> Input
      <input readonly> Output
    </aside>

  </section>
</main>
