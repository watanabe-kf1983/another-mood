# 並び順は掲載順。機能要求はユースケースの順 (業務の時系列) に、続けて
# 外部インタフェース / 品質 / 設計制約 の順に並べる。ID は種別を含めない連番で、
# 掲載順とは一致しない (後から足した R21 は、担うユースケース UC07 の位置に置く)。
要求:
  # --- 機能 (ユースケースごと) ---------------------------------------------
  R01:
    題名: ISBN の形式検査
    種別: 機能
    記述: システムは、書籍登録で入力された ISBN が 13 桁でチェックディジットが正しいときに限り、登録を受け付けなければならない。
    理由: 誤った ISBN で登録された書籍は、入荷や販売の通知と突き合わせられない。
    適合基準: チェックディジットの誤った 13 桁の値と 10 桁の値を入力すると登録が拒否され、正しい 13 桁の値では受け付けられる。
    優先度: 必須
    検証方法: 試験
    ユースケース: UC01
  R02:
    題名: ISBN の重複登録の禁止
    種別: 機能
    記述: システムは、登録済みの ISBN と同じ ISBN の書籍を二重に登録してはならない。
    理由: 同じ書籍に在庫が二つあると、在庫数が分かれて照会と棚卸の結果が狂う。
    適合基準: 登録済みの ISBN を入力すると、登録済みの書籍が示され、登録が中止される。
    優先度: 必須
    検証方法: 試験
    ユースケース: UC01
  R03:
    題名: 仕入先の名称と連絡先の登録
    種別: 機能
    記述: システムは、仕入先を名称と連絡先で登録し、入荷登録の相手先として選べるようにしなければならない。
    適合基準: 登録した仕入先が入荷登録の相手先の一覧に現れ、選ぶと入荷にその仕入先が記録される。
    優先度: 必須
    検証方法: 試験
    ユースケース: UC02
  R04:
    題名: 入荷時の在庫加算
    種別: 機能
    記述: システムは、入荷の確定時に、明細の各書籍の在庫数に入荷数量を加算しなければならない。
    理由: 在庫数が入荷を即時に反映しないと、在庫照会の結果を信頼できない。
    適合基準: 入荷を確定した直後の在庫照会で、明細の各書籍の在庫数が確定前の値に入荷数量を加えた値になっている。
    優先度: 必須
    検証方法: 試験
    ユースケース: UC03
  R05:
    題名: 未登録書籍の入荷拒否
    種別: 機能
    記述: システムは、未登録の ISBN を入荷の明細に加えてはならない。
    理由: 未登録の書籍を入荷で受け付けると、書名も出版社も無い在庫ができる。
    適合基準: 未登録の ISBN を指定すると明細に加わらず、先に書籍登録を行うよう促す旨が示される。
    優先度: 必須
    検証方法: 試験
    ユースケース: UC03
  R06:
    題名: 販売通知による在庫減算
    種別: 機能
    記述: システムは、決済サービスから販売の通知を受けたとき、通知された各書籍の在庫数から販売数量を減算しなければならない。
    理由: 販売のたびに店員が在庫を減らす手間を無くし、在庫数を実売に追随させる。
    適合基準: 販売の通知を受けた直後の在庫照会で、通知された各書籍の在庫数が通知前の値から販売数量を引いた値になっている。
    優先度: 必須
    検証方法: 試験
    ユースケース: UC04
  R07:
    題名: 未登録書籍の販売の保留
    種別: 機能
    記述: システムは、販売の通知に未登録の ISBN が含まれるとき、その販売を保留として記録し、店員に書籍の確認を求めなければならない。
    理由: 通知を捨てると販売が在庫に反映されず、通知を拒否すると決済サービス側の処理を止める。
    適合基準: 未登録の ISBN を含む通知を送ると、通知は受領され、保留の販売として店員の確認待ちに現れる。
    優先度: 必須
    検証方法: 試験
    ユースケース: UC04
  R08:
    題名: 在庫不足の販売の通知
    種別: 機能
    記述: システムは、販売数量が在庫数を超える販売を受けたとき、在庫数を減算したうえで、その書籍を要確認として店員に知らせなければならない。
    理由: 在庫数が実数と食い違っている兆候であり、放置すると次の棚卸まで気づけない。
    適合基準: 在庫数 1 の書籍に数量 2 の販売を通知すると、在庫数が -1 になり、その書籍が要確認として店員に示される。
    優先度: 重要
    検証方法: 試験
    ユースケース: UC04
  R21:
    題名: 保留販売の確認による在庫反映
    種別: 機能
    記述: システムは、店員が保留の販売の各明細に登録済みの書籍を対応付けて確認を確定したとき、対応付けた書籍の在庫数から販売数量を減算し、その販売を確定にしなければならない。
    理由: 保留として受領した販売は在庫数に反映されていない。反映されない販売が残る限り、在庫数は実数から離れ続ける。
    適合基準: 未登録の ISBN を含む通知で保留になった販売について、その書籍を登録して確認を確定すると、書籍の在庫数が販売数量の分だけ減り、その販売が確定として在庫変動の履歴に現れる。
    優先度: 必須
    検証方法: 試験
    ユースケース: UC07
  R09:
    題名: 棚卸による在庫数の置き換え
    種別: 機能
    記述: システムは、棚卸の確定時に、各書籍の在庫数を入力された実数に置き換えなければならない。
    適合基準: 棚卸を確定した直後の在庫照会で、各書籍の在庫数が棚卸で入力した実数と一致する。
    優先度: 必須
    検証方法: 試験
    ユースケース: UC05
  R10:
    題名: 棚卸差異の記録
    種別: 機能
    記述: システムは、棚卸の確定時に、書籍ごとの基準の在庫数と実数の差異を棚卸の記録として保存しなければならない。
    理由: 差異の原因 (紛失、未反映の販売、入力誤り) を後から調べるには、置き換え前の値が要る。
    適合基準: 棚卸の確定後に、その棚卸の記録から書籍ごとの基準の在庫数、実数、差異を参照できる。
    優先度: 必須
    検証方法: 試験
    ユースケース: UC05
  R11:
    題名: 棚卸中の在庫変動の排除
    種別: 機能
    記述: システムは、棚卸の開始から確定までの間、入荷登録・販売反映・保留販売の確認による在庫数の変更を受け付けてはならない。
    理由: 棚卸中に在庫が動くと、基準の在庫数と実数の差異が棚卸の差異なのか業務の反映なのか区別できない。
    適合基準: 棚卸中に入荷の確定、販売の通知、保留販売の確認の確定を行うと、いずれも拒否され、棚卸の確定後に受け付けられる。
    優先度: 重要
    検証方法: 試験
    ユースケース: UC05
  R12:
    題名: 書名と ISBN による書籍の検索
    種別: 機能
    記述: システムは、書名の部分一致または ISBN の完全一致で書籍を検索し、該当する書籍と現在の在庫数を一覧しなければならない。
    適合基準: 書名の一部を入力するとそれを含む書籍がすべて一覧され、ISBN を入力するとその書籍だけが一覧される。
    優先度: 必須
    検証方法: 試験
    ユースケース: UC06
  R13:
    題名: 在庫変動の履歴の表示
    種別: 機能
    記述: システムは、書籍ごとに、入荷・販売・棚卸による在庫数の変動を日時の順に表示しなければならない。
    理由: 在庫数が合わないとき、いつどの業務で動いたかを店員が自分で追えるようにする。
    適合基準: 入荷、販売、棚卸を 1 回ずつ行った書籍の履歴に、3 件の変動が日時の順に、業務の種類と数量を伴って表示される。
    優先度: 重要
    検証方法: 試験
    ユースケース: UC06
  # --- 外部インタフェース --------------------------------------------------
  R14:
    題名: 決済サービスからの販売通知の受付
    種別: 外部インタフェース
    記述: システムは、決済サービスから販売ごとに送られる書籍 (ISBN) と数量の組の通知を受け付け、受領を返さなければならない。
    理由: 販売の反映は決済サービスの通知だけを入口とし、店員の手入力を持たない。
    適合基準: 決済サービスの仕様に沿った形式の通知を送ると受領が返り、形式に反する通知には受領でない応答が返る。
    優先度: 必須
    検証方法: 試験
  R15:
    題名: 店舗内端末のブラウザからの利用
    種別: 外部インタフェース
    記述: システムは、店舗内の PC とタブレットのブラウザから、追加のソフトウェアを導入せずに利用できなければならない。
    理由: 店員は売場のタブレットと事務室の PC を行き来し、端末ごとの導入作業は負担になる。
    適合基準: 店舗で用いる PC とタブレットの標準ブラウザで、全ユースケースの基本シナリオを完了できる。
    優先度: 必須
    検証方法: デモンストレーション
  # --- 品質 ----------------------------------------------------------------
  R16:
    題名: 在庫照会の応答時間
    種別: 品質
    記述: システムは、在庫照会の検索結果を 2 秒以内に表示しなければならない。
    理由: 店頭で顧客を待たせずに在庫を答えるため。
    適合基準: 書籍 1 万件を登録した状態で、書名の部分一致検索の結果が 2 秒以内に表示される。
    優先度: 重要
    検証方法: 試験
  R17:
    題名: 複数店員の同時利用
    種別: 品質
    記述: システムは、5 名の店員が同時に利用しても、各ユースケースを完了できなければならない。
    適合基準: 5 台の端末から同時に入荷登録と在庫照会を行い、すべてが完了して在庫数が矛盾しない。
    優先度: 重要
    検証方法: 試験
  R18:
    題名: 在庫変動の記録の保全
    種別: 品質
    記述: システムは、入荷・販売・棚卸の記録を、記録から 1 年間、利用者の操作で削除も変更もできない形で保持しなければならない。
    理由: 在庫の食い違いの原因調査と、棚卸の結果の説明に、過去の記録がそのまま要る。
    適合基準: 記録の削除・変更の操作が利用者に提供されず、1 年以内の記録が在庫変動の履歴に表示される。
    優先度: 必須
    検証方法: 検査
  # --- 設計制約 ------------------------------------------------------------
  R19:
    題名: 単独で動作する Web アプリケーション
    種別: 設計制約
    記述: システムは、店舗内で単独で動作する Web アプリケーションとして実装しなければならず、決済サービス以外の外部サービスに依存してはならない。
    理由: 店舗の回線障害時にも在庫の参照と入荷登録を続けられるようにする。
    適合基準: 決済サービスへの経路を遮断した状態で、販売反映以外のユースケースの基本シナリオを完了できる。
    優先度: 必須
    検証方法: デモンストレーション
  R20:
    題名: 書籍の識別子としての ISBN
    種別: 設計制約
    記述: システムは、書籍を ISBN で識別しなければならず、システム独自の書籍番号を利用者に見せてはならない。
    理由: 仕入先と決済サービスはいずれも ISBN で書籍を指すので、別の番号を持つと対応表が要る。
    適合基準: 画面と決済サービスとのやり取りで書籍を指す番号が ISBN のみである。
    優先度: 必須
    検証方法: 検査
