用語:
  書籍:
    用語: 書籍
    読み: しょせき
    定義: 本システムが在庫として扱う商品。ISBN を持つ出版物に限り、雑貨や ISBN の無い冊子は扱わない。
  ISBN:
    用語: ISBN
    読み: あいえすびーえぬ
    定義: 国際標準図書番号。書籍を一意に識別する 13 桁の番号で、本システムでは書籍の識別子として用いる。
  在庫:
    用語: 在庫
    読み: ざいこ
    定義: 店舗が現に保有する書籍の数量。書籍ごとに 1 つの在庫数を持ち、入荷で増え、販売で減り、棚卸で実数に合わせる。
  入荷:
    用語: 入荷
    読み: にゅうか
    定義: 仕入先から書籍が店舗に届き、在庫に加える業務。1 回の入荷は 1 つの仕入先からの複数の書籍と数量からなる。
  販売:
    用語: 販売
    読み: はんばい
    定義: 店頭で書籍を顧客に売り、在庫から減らす業務。決済は外部の決済サービスで行い、本システムは確定した販売の書籍と数量を受け取る。
  棚卸:
    用語: 棚卸
    読み: たなおろし
    定義: 店頭と倉庫の書籍を実際に数え、システム上の在庫数を実数に合わせる業務。差異は棚卸の記録として残す。
  仕入先:
    用語: 仕入先
    読み: しいれさき
    定義: 店舗に書籍を納入する取次や出版社。入荷の相手先として記録する。
