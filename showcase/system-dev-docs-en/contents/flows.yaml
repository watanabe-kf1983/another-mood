# The data flows of the business model. They are recorded per level, and a
# lower-level flow names the higher-level flow that bundles it in parent_id
# (flows that stay inside a diagram, and the flows of the context diagram,
# have no parent_id). That is why the same flow name appears at several
# levels.
#
# source / target is exactly one of process_id / data_store_id /
# external_entity_id. The order is by level, and within a level grouped by
# parent process.
flows:
  # --- Context diagram (between Bookstore operations and the external entities) ---
  F01:
    name: Purchase
    description: The books the customer has chosen, and the payment.
    source: { external_entity_id: customer }
    target: { process_id: P0 }
  F02:
    name: Receipt
    source: { process_id: P0 }
    target: { external_entity_id: customer }
  F03:
    name: Order
    description: The books and quantities ordered.
    source: { process_id: P0 }
    target: { external_entity_id: supplier }
  F04:
    name: Delivery
    description: The books delivered, with the delivery note.
    source: { external_entity_id: supplier }
    target: { process_id: P0 }

  # --- Diagram 0 (decomposition of Bookstore operations): Purchasing ---
  F05:
    name: Order
    source: { process_id: P1 }
    target: { external_entity_id: supplier }
    parent_id: F03
  F06:
    name: Delivery
    source: { external_entity_id: supplier }
    target: { process_id: P1 }
    parent_id: F04
  F07:
    name: Stock quantity
    source: { data_store_id: stock_ledger }
    target: { process_id: P1 }
  F08:
    name: Supplier
    source: { data_store_id: supplier_ledger }
    target: { process_id: P1 }
  F09:
    name: Book details
    source: { data_store_id: book_ledger }
    target: { process_id: P1 }
  F10:
    name: Delivery lines
    source: { process_id: P1 }
    target: { data_store_id: delivery_records }
  F11:
    name: Delivered quantity
    source: { process_id: P1 }
    target: { data_store_id: stock_ledger }
  F12:
    name: New book
    source: { process_id: P1 }
    target: { data_store_id: book_ledger }
  F13:
    name: New supplier
    source: { process_id: P1 }
    target: { data_store_id: supplier_ledger }

  # --- Diagram 0: Sales ---
  F14:
    name: Purchase
    source: { external_entity_id: customer }
    target: { process_id: P2 }
    parent_id: F01
  F15:
    name: Receipt
    source: { process_id: P2 }
    target: { external_entity_id: customer }
    parent_id: F02
  F16:
    name: Book details
    source: { data_store_id: book_ledger }
    target: { process_id: P2 }
  F17:
    name: Sale lines
    source: { process_id: P2 }
    target: { data_store_id: sales_records }
  F18:
    name: Sold quantity
    source: { process_id: P2 }
    target: { data_store_id: stock_ledger }
  F19:
    name: Pending sale
    source: { data_store_id: sales_records }
    target: { process_id: P2 }

  # --- Diagram 0: Inventory control ---
  F20:
    name: Stock quantity
    source: { data_store_id: stock_ledger }
    target: { process_id: P3 }
  F21:
    name: Counted quantity
    description: The stock quantity replaced by the counted figure.
    source: { process_id: P3 }
    target: { data_store_id: stock_ledger }
  F22:
