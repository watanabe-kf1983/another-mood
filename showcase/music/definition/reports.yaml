# Two editions of the same data, differing only in `file_per` (which nodes
# get a page of their own).
#
#   web  — browse online: index.md is the cover and contents, each
#          section page (roster, discography, curated) and each
#          artist, album, genre and label gets a page of its own.
#   book — read as one bound document: empty file_per keeps everything
#          inlined into a single index.md.
editions:
  web:
    file_per:
      - roster
      - roster.artists.item
      - discography
      - discography.albums.item
      - discography.genres.item
      - discography.labels.item
      - curated
  book:
    file_per: []
