# Each album with its tracks and its optional liner-note prose attached -
# exercises the ``join:`` list form mixing a nested attach with a
# ``preserve_empty`` singleton flatten. ``sort`` puts the albums in release
# order, so the list and the album pages rendered after it agree.
discography.albums:
  from: albums
  join:
    - to: tracks
      on: { left: id, right: album_id }
      as: tracks
    - to: prose
      on: { left: liner_notes, right: id }
      as: liner_matches
      flatten: { as: liner, preserve_empty: true }
  select:
    - item: id
    - item: title
    - item: artist_id
    - item: label_id
    - item: genre_id
    - item: year
    - item: is_live
    - item: cover
    - item: tracks
    - item: liner
  sort:
    by: year

# Each genre with its subgenres and albums attached - exercises a
# self-join (``genres`` matched against its own ``parent_id``).
discography.genres:
  from: genres
  join:
    - to: genres
      on: { left: id, right: parent_id }
      as: subgenres
    - to: albums
      on: { left: id, right: genre_id }
      as: albums

# Each label with the albums released on it attached.
discography.labels:
  from: labels
  join:
    to: albums
    on: { left: id, right: label_id }
    as: albums

# Albums whose id starts with ``live_`` - exercises ``where: startswith``
# (the naming convention, not the ``is_live`` flag, does the picking).
discography.live_albums:
  from: albums
  where:
    id: { startswith: live_ }
  select:
    - item: id
    - item: title
    - item: year

# Tracks whose title contains ``Live`` - exercises ``where: contains`` and
# a chained join: the second join's key (``album.artist_id``) is an
# attribute the first join introduced, and its dotted ``as`` lands the
# artist inside ``album`` (``row.album.artist``).
discography.live_tracks:
  from: tracks
  where:
    title: { contains: Live }
  join:
    - to: albums
      on: { left: album_id, right: id }
      as: album_matches
      flatten: { as: album }
    - to: artists
      on: { left: album.artist_id, right: id }
      as: album.artist_matches
      flatten: { as: album.artist }
  select:
    - item: id
    - item: title
    - item: album
