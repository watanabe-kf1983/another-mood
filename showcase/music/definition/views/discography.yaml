# Albums grouped by genre - exercises ``grouped:``. The grouping field
# (``genre_id``) is re-emitted in ``select:`` once as the group key and
# once renamed as ``id`` so the template can use it as a path slug.
albums_by_genre:
  from: albums
  grouped:
    by: genre_id
    as: albums
  select:
    - item: genre_id
      as: id
    - item: genre_id
    - item: albums

# Each genre group with its genre record attached - exercises a
# view-to-view reference (``from:`` names the ``albums_by_genre`` view
# above, not a data entity). The genre name can't be joined in
# ``albums_by_genre`` itself because ``join:`` runs before ``grouped:``
# in the fixed pipeline order; splitting into two views and referencing
# the first from the second is the escape hatch. Without it the template
# would have to re-join genres on its own
# (``node("genres", entry.genre_id).name``).
discography.by_genre:
  from: albums_by_genre
  join:
    to: genres
    on: { left: genre_id, right: id }
    as: genre_matches
    flatten: { as: genre }
  select:
    - item: genre_id
    - item: genre
    - item: albums

# Each album with its tracks attached as a nested list, plus its optional
# liner-note prose joined in as ``liner`` (a descendant of the album).
# Exercises the ``join:`` list form mixing a nested attach (``tracks``) with
# a ``preserve_empty`` singleton flatten.
discography.albums:
  from: albums
  join:
    - to: tracks
      on: { left: id, right: album_id }
      as: tracks
    - to: prose
      on: { left: liner_notes, right: id }
      as: liner_matches
      flatten: { as: liner, preserve_empty: true }
  select:
    - item: id
    - item: title
    - item: artist_id
    - item: label_id
    - item: genre_id
    - item: year
    - item: is_live
    - item: cover
    - item: tracks
    - item: liner

# The genre and label records copied under ``discography`` so the
# discography page can list them - a ``from:`` with nothing else is a
# plain copy. A page renders only what lies under it, and a nested view
# is how a page gathers datasets that live elsewhere in the tree.
discography.genres:
  from: genres

discography.labels:
  from: labels

# Albums whose id starts with ``live_`` - exercises ``where: startswith``.
# The naming convention picks out concert recordings without referring to
# the ``is_live`` flag.
discography.live_albums:
  from: albums
  where:
    id: { startswith: live_ }
  select:
    - item: id
    - item: title
    - item: year

# Tracks whose title contains ``Live`` - exercises ``where: contains`` -
# with each track's album and the album's artist attached. The ``join:``
# list form chains: the first join brings the album in, and the second
# join uses an attribute introduced by the first join's
# ``flatten: { as: album }`` (``album.artist_id``) as the lookup key for
# the second match. The second join's ``as`` is a dotted path, so the
# artist lands inside ``album`` (``row.album.artist``).
discography.live_tracks:
  from: tracks
  where:
    title: { contains: Live }
  join:
    - to: albums
      on: { left: album_id, right: id }
      as: album_matches
      flatten: { as: album }
    - to: artists
      on: { left: album.artist_id, right: id }
      as: album.artist_matches
      flatten: { as: album.artist }
  select:
    - item: id
    - item: title
    - item: album
