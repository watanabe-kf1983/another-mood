# Each album with its tracks attached as a nested list, plus its optional
# liner-note prose joined in as ``liner`` (a descendant of the album).
# Exercises the ``join:`` list form mixing a nested attach (``tracks``) with
# a ``preserve_empty`` singleton flatten. ``sort`` puts the albums in
# release order, so the list and the album pages rendered after it agree.
discography.albums:
  from: albums
  join:
    - to: tracks
      on: { left: id, right: album_id }
      as: tracks
    - to: prose
      on: { left: liner_notes, right: id }
      as: liner_matches
      flatten: { as: liner, preserve_empty: true }
  select:
    - item: id
    - item: title
    - item: artist_id
    - item: label_id
    - item: genre_id
    - item: year
    - item: is_live
    - item: cover
    - item: tracks
    - item: liner
  sort:
    by: year

# Each genre with its subgenres and albums attached. The first join is a
# self-reference: ``genres`` joined to itself, matching each genre's
# ``id`` against the others' ``parent_id``, so a genre page can list its
# subgenres without walking the hierarchy in the template.
discography.genres:
  from: genres
  join:
    - to: genres
      on: { left: id, right: parent_id }
      as: subgenres
    - to: albums
      on: { left: id, right: genre_id }
      as: albums

# Each label with the albums released on it attached.
discography.labels:
  from: labels
  join:
    to: albums
    on: { left: id, right: label_id }
    as: albums

# Albums whose id starts with ``live_`` - exercises ``where: startswith``.
# The naming convention picks out concert recordings without referring to
# the ``is_live`` flag.
discography.live_albums:
  from: albums
  where:
    id: { startswith: live_ }
  select:
    - item: id
    - item: title
    - item: year

# Tracks whose title contains ``Live`` - exercises ``where: contains`` -
# with each track's album and the album's artist attached. The ``join:``
# list form chains: the first join brings the album in, and the second
# join uses an attribute introduced by the first join's
# ``flatten: { as: album }`` (``album.artist_id``) as the lookup key for
# the second match. The second join's ``as`` is a dotted path, so the
# artist lands inside ``album`` (``row.album.artist``).
discography.live_tracks:
  from: tracks
  where:
    title: { contains: Live }
  join:
    - to: albums
      on: { left: album_id, right: id }
      as: album_matches
      flatten: { as: album }
    - to: artists
      on: { left: album.artist_id, right: id }
      as: album.artist_matches
      flatten: { as: album.artist }
  select:
    - item: id
    - item: title
    - item: album
