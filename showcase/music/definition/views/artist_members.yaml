# All band members across all artists, flattened into one row per
# member. Each row carries the parent artist's id/name nested under
# ``artist`` and the member's attributes nested under ``member`` -
# exercises the ``flatten`` clause on the intrinsic ``artists.members``
# child entity, and a dotted ``as`` that lands a field inside an object.
artist_members:
  from: artists
  flatten:
    of: members
    as: member
  select:
    - item: id
      as: artist.id
    - item: name
      as: artist.name
    - item: member
