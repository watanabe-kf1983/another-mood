type: object
additionalProperties: false
properties:
  artists:
    type: object
    additionalProperties:
      type: object
      description: An artist or band that appears in the catalog. May own zero or more albums and zero or more members.
      additionalProperties: false
      properties:
        name:
          type: string
          description: Display name of the artist or band.
        country:
          type: string
          description: Primary country of operation (free-form, e.g. "Japan").
        formed_year:
          type: integer
          description: Year the act was formed.
        bio:
          type: string
          description: Short prose description shown on the artist's page.
        members:
          type: object
          description: Current line-up, keyed by a short slug. Optional - an artist with no settled line-up may omit it or leave it empty.
          additionalProperties:
            type: object
            description: One member of an artist's line-up.
            additionalProperties: false
            properties:
              name:
                type: string
                description: Display name of the member.
              instrument:
                type: string
                description: Primary instrument or role within the group (e.g. "guitar", "vocals").
            required: [name]
      required: [name]

  labels:
    type: object
    additionalProperties:
      type: object
      description: A record label that releases albums in this catalog.
      additionalProperties: false
      properties:
        name:
          type: string
          description: Display name of the label.
        country:
          type: string
          description: Country the label is based in.
        founded:
          type: integer
          description: Year the label was founded.
      required: [name]

  genres:
    type: object
    additionalProperties:
      type: object
      description: A musical genre. Genres form a forest - top-level genres have no parent_id, and subgenres point at their parent via parent_id (self-reference).
      additionalProperties: false
      properties:
        name:
          type: string
          description: Display name of the genre.
        parent_id:
          type: string
          description: Id of the parent genre. Omitted for top-level genres.
          x-ref:
            entity: genres
      required: [name]

  albums:
    type: object
    additionalProperties:
      type: object
      description: A studio or live album. Each album belongs to exactly one artist; label and genre are optional but typical.
      additionalProperties: false
      properties:
        title:
          type: string
          description: Album title.
        artist_id:
          type: string
          description: Id of the artist who released this album.
          x-ref:
            entity: artists
        label_id:
          type: string
          description: Id of the label that released this album.
          x-ref:
            entity: labels
        genre_id:
          type: string
          description: Id of the album's primary genre.
          x-ref:
            entity: genres
        year:
          type: integer
          description: Year of release.
        is_live:
          type: boolean
          description: True for concert recordings, false (or omitted) for studio albums.
        liner_notes:
          type: string
          description: Id of the prose record holding this album's liner notes (a contents-relative path without extension). Optional - only some albums have liner notes.
          x-ref:
            entity: prose
        cover:
          type: string
          description: Id of the cover-art blob (a contents-relative path, extension included). Optional - only some albums ship cover art.
          x-ref:
            entity: blob
      required: [title, artist_id, year]

  tracks:
    type: object
    additionalProperties:
      type: object
      description: A single track. Each track belongs to exactly one album.
      additionalProperties: false
      properties:
        title:
          type: string
          description: Track title.
        album_id:
          type: string
          description: Id of the album this track appears on.
          x-ref:
            entity: albums
        track_no:
          type: integer
          description: Position of the track within the album, 1-indexed.
        duration_sec:
          type: integer
          description: Duration in whole seconds.
      required: [title, album_id, track_no]

  playlists:
    type: object
    additionalProperties:
      type: object
      description: A curated listening order over tracks. Membership and order are recorded separately in playlist_tracks (N:N).
      additionalProperties: false
      properties:
        name:
          type: string
          description: Display name of the playlist.
        curator:
          type: string
          description: Id or short name of whoever assembled the playlist (an artist id, or a free-form tag such as "editorial").
        description:
          type: string
          description: Short prose blurb shown alongside the playlist title.
      required: [name]

  playlist_tracks:
    type: array
    items:
      type: object
      description: Membership link between a playlist and a track. The position field gives playback order within the playlist. Stored as an array (not a map) because no entry has a natural single-field key.
      additionalProperties: false
      properties:
        playlist_id:
          type: string
          description: Id of the playlist this entry belongs to.
          x-ref:
            entity: playlists
        track_id:
          type: string
          description: Id of the track included in the playlist.
          x-ref:
            entity: tracks
        position:
          type: integer
          description: 1-indexed playback position within the playlist.
      required: [playlist_id, track_id, position]

  # The catalog's own front matter: one record, not a collection (the
  # single-record pattern), together with two plain values beside it. It
  # covers every shape that can sit directly under the root besides a
  # collection: a singleton, the scalars and collections inside it (array
  # and map forms, one with a child collection), a singleton nested in it
  # that holds a collection (map form), a top-level scalar and a top-level
  # scalar array.
  catalog:
    type: object
    description: Front matter of the catalog as a whole - its title, who keeps it, and the editorial selections shown on the front page.
    additionalProperties: false
    properties:
      title:
        type: string
        description: Title of the catalog, shown as the front page heading.
      maintainer:
        type: string
        description: Who keeps the catalog up to date (free-form).
      featured:
        type: array
        description: Albums highlighted on the front page, in display order.
        items:
          type: object
          description: One highlighted album.
          additionalProperties: false
          properties:
            album_id:
              type: string
              description: Id of the highlighted album.
              x-ref:
                entity: albums
            note:
              type: string
              description: One-line reason for the highlight.
          required: [album_id]
      series:
        type: object
        description: Thematic series grouping albums across artists, keyed by a short slug.
        additionalProperties:
          type: object
          description: One series.
          additionalProperties: false
          properties:
            name:
              type: string
              description: Display name of the series.
            description:
              type: string
              description: Short blurb about what ties the series together.
            albums:
              type: array
              description: The albums in the series, in listening order.
              items:
                type: object
                description: One album's place in the series.
                additionalProperties: false
                properties:
                  album_id:
                    type: string
                    description: Id of the album.
                    x-ref:
                      entity: albums
                required: [album_id]
          required: [name]
      editorial:
        type: object
        description: The editorial desk's corner of the front page.
        additionalProperties: false
        properties:
          editor:
            type: string
            description: Name of the editor currently signing the picks.
          picks:
            type: object
            description: Single tracks the editor recommends, keyed by a short slug.
            additionalProperties:
              type: object
              description: One recommended track.
              additionalProperties: false
              properties:
                track_id:
                  type: string
                  description: Id of the recommended track.
                  x-ref:
                    entity: tracks
                comment:
                  type: string
                  description: The editor's one-line comment.
              required: [track_id]
    required: [title]

  updated_at:
    type: string
    description: Date the catalog was last revised (YYYY-MM-DD).

  moods:
    type: array
    description: Mood tags describing the catalog as a whole.
    items:
      type: string
