# 並び順はメニューを先頭に、以降はユースケースの記述順 (業務の時系列)。
# 画面一覧はこの順で描き、画面遷移図の state もこの順で宣言する。
# ID は IPA 画面一覧の画面 ID にならった連番 (SC = screen)。ユースケースと同じく
# ID は識別子で並び順ではないので、後から足した画面 (SC08) は関連ユースケースの
# 位置に置き、既存の ID は付け替えない。
#
# 画面はユースケースを利用者が遂行するための入口なので、アクターが外部システム
# だけのユースケース (販売反映) は画面を持たない。ユースケースの基本シナリオが
# 一つの画面に収まらないもの (在庫照会: 検索一覧 → 履歴) は画面を分ける。
# 画面とユースケースは多対多で、一つの画面が複数のユースケースに使われることが
# ある (書籍履歴画面は在庫照会の他に、書籍登録で登録済みの書籍を示すのにも使う)。
#
# アクションの 遷移 は画面が変わるものだけを書く。画面内で完結する操作
# (検索、明細の追加、同じ画面で続けて行う登録) は 遷移 を持たない。
# 条件付きの遷移 (例外時の分岐) は 条件 を書き、無条件の遷移は省略する。
# アクションの 説明 はユースケースの基本シナリオの応答 (と例外の応答) を
# 画面の言葉に写したもの。
#
# 入出力項目の 参照先 はデータモデルの属性を指す。画面にしか無い項目 (検索語)
# や、複数のエンティティを一つの表に畳む項目 (書籍履歴画面の履歴) は参照先を
# 持たず、意味は 説明 に書く。
画面:
  SC01:
    名前: メニュー画面
    分類: メニュー
    説明: 起動直後に表示され、各業務の画面へ進む入口。
    画面レイアウト:
      図: 画面レイアウト/SC01.svg
      原本: 画面レイアウト/SC01.html
    アクション:
      - 名前: 書籍登録を選ぶ
        説明: 書籍登録画面へ進む。
        遷移:
          - 遷移先: SC02
      - 名前: 仕入先登録を選ぶ
        説明: 仕入先登録画面へ進む。
        遷移:
          - 遷移先: SC03
      - 名前: 入荷登録を選ぶ
        説明: 入荷登録画面へ進む。
        遷移:
          - 遷移先: SC04
      - 名前: 保留販売の確認を選ぶ
        説明: 保留販売確認画面へ進む。
        遷移:
          - 遷移先: SC08
      - 名前: 棚卸を選ぶ
        説明: 棚卸画面へ進む。
        遷移:
          - 遷移先: SC05
      - 名前: 在庫照会を選ぶ
        説明: 在庫一覧画面へ進む。
        遷移:
          - 遷移先: SC06

  SC02:
    名前: 書籍登録画面
    分類: 登録
    説明: 新たに取り扱う書籍の ISBN、書名、出版社を入力して登録する。登録後は続けて次の書籍を入力できる。
    画面レイアウト:
      図: 画面レイアウト/SC02.svg
      原本: 画面レイアウト/SC02.html
    ユースケース:
      - ID: UC01
    入出力項目:
      - 名前: ISBN
        入出力: 入力
        参照先: { エンティティ: 書籍, 属性: ISBN }
      - 名前: 書名
        入出力: 入力
        参照先: { エンティティ: 書籍, 属性: 書名 }
      - 名前: 出版社
        入出力: 入力
        参照先: { エンティティ: 書籍, 属性: 出版社 }
    アクション:
      - 名前: ISBN を入力する
        説明: ISBN の形式を検査し、正しければ書名と出版社の入力を受け付ける。形式が誤りなら再入力を促す。同じ ISBN の書籍が登録済みなら、書籍履歴画面でその書籍を示して登録を中止する。
        遷移:
          - 条件: 同じ ISBN の書籍が登録済み
            遷移先: SC07
      - 名前: 登録する
        説明: 書籍を登録し、在庫数 0 の在庫に加える。入力欄を空にして、次の書籍の入力を受け付ける。
      - 名前: メニューへ戻る
        説明: メニュー画面へ戻る。
        遷移:
          - 遷移先: SC01

  SC03:
    名前: 仕入先登録画面
    分類: 登録
    説明: 仕入先の名称と連絡先を入力して登録する。登録後は続けて次の仕入先を入力できる。
    画面レイアウト:
      図: 画面レイアウト/SC03.svg
      原本: 画面レイアウト/SC03.html
    ユースケース:
      - ID: UC02
    入出力項目:
      - 名前: 名称
        入出力: 入力
        参照先: { エンティティ: 仕入先, 属性: 名称 }
      - 名前: 連絡先
        入出力: 入力
        参照先: { エンティティ: 仕入先, 属性: 連絡先 }
    アクション:
      - 名前: 登録する
        説明: 仕入先を登録し、入荷の相手先の一覧に加える。同じ名称の仕入先が登録済みなら既存の仕入先を示し、そのまま登録するか中止するかを問う。
      - 名前: メニューへ戻る
        説明: メニュー画面へ戻る。
        遷移:
          - 遷移先: SC01

  SC04:
    名前: 入荷登録画面
    分類: 登録
    説明: 仕入先を選び、届いた書籍と数量を明細として積み上げ、入荷を確定する。
    画面レイアウト:
      図: 画面レイアウト/SC04.svg
      原本: 画面レイアウト/SC04.html
    ユースケース:
      - ID: UC03
    入出力項目:
      - 名前: 仕入先
        入出力: 入力
        参照先: { エンティティ: 入荷, 属性: 仕入先ID }
        説明: 登録済みの仕入先から選ぶ。
      - 名前: 入荷日時
        入出力: 出力
        参照先: { エンティティ: 入荷, 属性: 入荷日時 }
        説明: 確定時の日時をシステムが与える。
      - 名前: ISBN
        入出力: 入力
        参照先: { エンティティ: 入荷明細, 属性: ISBN }
        説明: 明細 1 行につき 1 冊種。
      - 名前: 書名
        入出力: 出力
        参照先: { エンティティ: 書籍, 属性: 書名 }
        説明: ISBN から引いて表示する。
      - 名前: 数量
        入出力: 入力
        参照先: { エンティティ: 入荷明細, 属性: 数量 }
    アクション:
      - 名前: 仕入先を選ぶ
        説明: 選んだ仕入先を入荷の相手先として保持し、明細の入力を受け付ける。
      - 名前: 明細を追加する
        説明: ISBN で指定した書籍の書名を表示し、数量とともに明細に加える。ISBN が未登録なら明細への追加を拒否し、書籍登録画面へ進めて先に書籍登録を行うよう促す。
        遷移:
          - 条件: ISBN が未登録
            遷移先: SC02
      - 名前: 確定する
        説明: 入荷を記録し、明細の各書籍の在庫数に数量を加算して、メニュー画面へ戻る。
        遷移:
          - 遷移先: SC01
      - 名前: メニューへ戻る
        説明: 入力中の入荷を破棄してメニュー画面へ戻る。
        遷移:
          - 遷移先: SC01

  SC08:
    名前: 保留販売確認画面
    分類: 登録
    説明: 未登録の書籍を含んで保留になった販売を一覧し、明細ごとに登録済みの書籍を対応付けて確認を確定する。
    画面レイアウト:
      図: 画面レイアウト/SC08.svg
      原本: 画面レイアウト/SC08.html
    ユースケース:
      - ID: UC07
    入出力項目:
      - 名前: 通知日時
        入出力: 出力
        参照先: { エンティティ: 販売, 属性: 通知日時 }
        説明: 確認待ちの販売を通知日時の順に並べる。
      - 名前: 通知ISBN
        入出力: 出力
        参照先: { エンティティ: 販売明細, 属性: 通知ISBN }
        説明: 選んだ販売の明細 1 行につき 1 件。決済サービスから通知された値をそのまま出す。
      - 名前: 数量
        入出力: 出力
        参照先: { エンティティ: 販売明細, 属性: 数量 }
      - 名前: ISBN
        入出力: 入力
        参照先: { エンティティ: 販売明細, 属性: ISBN }
        説明: 通知ISBN に対応する登録済みの書籍を指定する。
      - 名前: 書名
        入出力: 出力
        参照先: { エンティティ: 書籍, 属性: 書名 }
        説明: 指定された ISBN から引いて表示する。
    アクション:
      - 名前: 保留の販売を選ぶ
        説明: 選んだ販売の明細を、通知 ISBN と数量とともに一覧し、対応付ける書籍の入力を受け付ける。
      - 名前: 書籍を対応付ける
        説明: 指定された ISBN の書名を表示し、その明細の対応付けとして保持する。ISBN が未登録なら対応付けを拒否し、書籍登録画面へ進めて先に書籍登録を行うよう促す。
        遷移:
          - 条件: ISBN が未登録
            遷移先: SC02
      - 名前: 確認を確定する
        説明: 明細の各書籍の在庫数から数量を減算し、販売を確定にして確認待ちの一覧から除く。対応付けの済んでいない明細があれば確定を拒否し、その明細を示す。
      - 名前: メニューへ戻る
        説明: メニュー画面へ戻る。
        遷移:
          - 遷移先: SC01

  SC05:
    名前: 棚卸画面
    分類: 登録
    説明: 棚卸を開始して基準の在庫数を固定し、書籍ごとに数えた実数を入力して差異を確かめ、棚卸を確定する。
    画面レイアウト:
      図: 画面レイアウト/SC05.svg
      原本: 画面レイアウト/SC05.html
    ユースケース:
      - ID: UC05
    入出力項目:
      - 名前: 開始日時
        入出力: 出力
        参照先: { エンティティ: 棚卸, 属性: 開始日時 }
      - 名前: ISBN
        入出力: 出力
        参照先: { エンティティ: 棚卸明細, 属性: ISBN }
        説明: 全書籍を 1 行ずつ並べる。
      - 名前: 書名
        入出力: 出力
        参照先: { エンティティ: 書籍, 属性: 書名 }
      - 名前: 基準在庫数
        入出力: 出力
        参照先: { エンティティ: 棚卸明細, 属性: 基準在庫数 }
        説明: 開始時点の在庫数。
      - 名前: 実数
        入出力: 入力
        参照先: { エンティティ: 棚卸明細, 属性: 実数 }
      - 名前: 差異
        入出力: 出力
        参照先: { エンティティ: 棚卸明細, 属性: 差異 }
        説明: 実数を入力するたびに再計算する。
    アクション:
      - 名前: 棚卸を開始する
        説明: 全書籍の現在の在庫数を基準在庫数として記録し、実数の入力を受け付ける。
      - 名前: 実数を入力する
        説明: 書籍ごとに数えた実数を受け取り、基準在庫数との差異を表示する。
      - 名前: 確定する
        説明: 各書籍の在庫数を実数に置き換え、差異を棚卸の記録として保存して、メニュー画面へ戻る。実数が未入力の書籍があれば確定を拒否し、その書籍を示す。
        遷移:
          - 条件: 全書籍の実数が入力済み
            遷移先: SC01
      - 名前: メニューへ戻る
        説明: 棚卸を開始したままメニュー画面へ戻る。再び本画面を開くと、入力の続きを受け付ける。
        遷移:
          - 遷移先: SC01

  SC06:
    名前: 在庫一覧画面
    分類: 一覧
    説明: 書名または ISBN で書籍を検索し、該当する書籍と現在の在庫数を一覧する。
    画面レイアウト:
      図: 画面レイアウト/SC06.svg
      原本: 画面レイアウト/SC06.html
    ユースケース:
      - ID: UC06
    入出力項目:
      - 名前: 検索語
        入出力: 入力
        説明: 書名の一部、または ISBN。
      - 名前: ISBN
        入出力: 出力
        参照先: { エンティティ: 書籍, 属性: ISBN }
      - 名前: 書名
        入出力: 出力
        参照先: { エンティティ: 書籍, 属性: 書名 }
      - 名前: 出版社
        入出力: 出力
        参照先: { エンティティ: 書籍, 属性: 出版社 }
      - 名前: 在庫数
        入出力: 出力
        参照先: { エンティティ: 書籍, 属性: 在庫数 }
    アクション:
      - 名前: 検索する
        説明: 検索語に該当する書籍と現在の在庫数を一覧する。該当が無ければその旨を示す。
      - 名前: 書籍を選ぶ
        説明: 一覧から選んだ書籍の書籍履歴画面へ進む。
        遷移:
          - 遷移先: SC07
      - 名前: メニューへ戻る
        説明: メニュー画面へ戻る。
        遷移:
          - 遷移先: SC01

  SC07:
    名前: 書籍履歴画面
    分類: 照会
    説明: 一つの書籍について、現在の在庫数と、入荷・販売・棚卸の履歴を表示する。書籍登録で ISBN が重複したときに、登録済みの書籍を示す画面としても使う。
    画面レイアウト:
      図: 画面レイアウト/SC07.svg
      原本: 画面レイアウト/SC07.html
    ユースケース:
      - ID: UC06
      - ID: UC01
    入出力項目:
      - 名前: ISBN
        入出力: 出力
        参照先: { エンティティ: 書籍, 属性: ISBN }
      - 名前: 書名
        入出力: 出力
        参照先: { エンティティ: 書籍, 属性: 書名 }
      - 名前: 出版社
        入出力: 出力
        参照先: { エンティティ: 書籍, 属性: 出版社 }
      - 名前: 在庫数
        入出力: 出力
        参照先: { エンティティ: 書籍, 属性: 在庫数 }
      - 名前: 履歴の日時
        入出力: 出力
        説明: 入荷の入荷日時、販売の通知日時、棚卸の確定日時のいずれか。三種のイベントを一つの表に畳むため参照先は定めない。
      - 名前: 履歴の種別
        入出力: 出力
        説明: 入荷、販売、棚卸のいずれか。
      - 名前: 履歴の数量
        入出力: 出力
        説明: 入荷明細・販売明細の数量、または棚卸明細の差異。
    アクション:
      - 名前: 一覧へ戻る
        説明: 在庫一覧画面へ戻る。検索の結果は保持する。
        遷移:
          - 遷移先: SC06
