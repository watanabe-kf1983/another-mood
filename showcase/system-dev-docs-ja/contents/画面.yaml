# 並び順はメニューを先頭に、以降はユースケースの記述順 (業務の時系列)。
# 画面一覧はこの順で描き、画面遷移図の state もこの順で宣言する。
# ID は IPA 画面一覧の画面 ID にならった連番 (SC = screen)。
#
# 画面はユースケースを利用者が遂行するための入口なので、アクターが外部システム
# だけのユースケース (販売反映) は画面を持たない。ユースケースの基本シナリオが
# 一つの画面に収まらないもの (在庫照会: 検索一覧 → 履歴) は画面を分ける。
# 画面とユースケースは多対多で、一つの画面が複数のユースケースに使われることが
# ある (書籍履歴画面は在庫照会の他に、書籍登録で登録済みの書籍を示すのにも使う)。
#
# アクションの 遷移 は画面が変わるものだけを書く。画面内で完結する操作
# (検索、明細の追加、同じ画面で続けて行う登録) は 遷移 を持たない。
# 条件付きの遷移 (例外時の分岐) は 条件 を書き、無条件の遷移は省略する。
画面:
  SC01:
    名前: メニュー画面
    分類: メニュー
    説明: 起動直後に表示され、各業務の画面へ進む入口。
    アクション:
      - 名前: 書籍登録を選ぶ
        遷移:
          - 遷移先: SC02
      - 名前: 仕入先登録を選ぶ
        遷移:
          - 遷移先: SC03
      - 名前: 入荷登録を選ぶ
        遷移:
          - 遷移先: SC04
      - 名前: 棚卸を選ぶ
        遷移:
          - 遷移先: SC05
      - 名前: 在庫照会を選ぶ
        遷移:
          - 遷移先: SC06

  SC02:
    名前: 書籍登録画面
    分類: 登録
    説明: 新たに取り扱う書籍の ISBN、書名、出版社を入力して登録する。登録後は続けて次の書籍を入力できる。
    ユースケース:
      - ID: UC01
    アクション:
      - 名前: ISBN を入力する
        遷移:
          - 条件: 同じ ISBN の書籍が登録済み
            遷移先: SC07
      - 名前: 登録する
      - 名前: メニューへ戻る
        遷移:
          - 遷移先: SC01

  SC03:
    名前: 仕入先登録画面
    分類: 登録
    説明: 仕入先の名称と連絡先を入力して登録する。登録後は続けて次の仕入先を入力できる。
    ユースケース:
      - ID: UC02
    アクション:
      - 名前: 登録する
      - 名前: メニューへ戻る
        遷移:
          - 遷移先: SC01

  SC04:
    名前: 入荷登録画面
    分類: 登録
    説明: 仕入先を選び、届いた書籍と数量を明細として積み上げ、入荷を確定する。
    ユースケース:
      - ID: UC03
    アクション:
      - 名前: 仕入先を選ぶ
      - 名前: 明細を追加する
        遷移:
          - 条件: ISBN が未登録
            遷移先: SC02
      - 名前: 確定する
        遷移:
          - 遷移先: SC01
      - 名前: メニューへ戻る
        遷移:
          - 遷移先: SC01

  SC05:
    名前: 棚卸画面
    分類: 登録
    説明: 棚卸を開始して基準の在庫数を固定し、書籍ごとに数えた実数を入力して差異を確かめ、棚卸を確定する。
    ユースケース:
      - ID: UC05
    アクション:
      - 名前: 棚卸を開始する
      - 名前: 実数を入力する
      - 名前: 確定する
        遷移:
          - 条件: 全書籍の実数が入力済み
            遷移先: SC01
      - 名前: メニューへ戻る
        遷移:
          - 遷移先: SC01

  SC06:
    名前: 在庫一覧画面
    分類: 一覧
    説明: 書名または ISBN で書籍を検索し、該当する書籍と現在の在庫数を一覧する。
    ユースケース:
      - ID: UC06
    アクション:
      - 名前: 検索する
      - 名前: 書籍を選ぶ
        遷移:
          - 遷移先: SC07
      - 名前: メニューへ戻る
        遷移:
          - 遷移先: SC01

  SC07:
    名前: 書籍履歴画面
    分類: 照会
    説明: 一つの書籍について、現在の在庫数と、入荷・販売・棚卸の履歴を表示する。書籍登録で ISBN が重複したときに、登録済みの書籍を示す画面としても使う。
    ユースケース:
      - ID: UC06
      - ID: UC01
    アクション:
      - 名前: 一覧へ戻る
        遷移:
          - 遷移先: SC06
