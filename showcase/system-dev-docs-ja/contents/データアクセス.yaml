# ユースケース × エンティティ の関連レコード。行の並びはユースケースの順
# (業務の時系列)、同じユースケースの中はエンティティの順 (リソース → イベントの
# 作成順)。CRUD マトリクスの行と列はそれぞれ ユースケース と エンティティ の
# 記述順で描くのでこの並びには依らないが、エンティティ定義の逆引き (利用する
# ユースケース) はここでの並びのまま出るので、ユースケースの順に保つ。
#
# セルの値はユースケース記述の基本シナリオと例外から読み取り、C / U / D の別は
# 設計方針節の判断に従う: 在庫数は書籍の属性を更新する (D01)、入荷・販売・棚卸は
# 追記のみで更新も削除もしない (D02)、棚卸中は入荷の確定と販売通知の受付を
# 拒否するので入荷登録と販売反映は棚卸の状態を読む (D05, R11)。削除はどこにも
# 現れない。文字は C R U D の順に並べる。
データアクセス:
  # UC01 書籍登録: 同じ ISBN の有無を確かめ (R)、在庫数 0 の書籍を登録する (C)
  - ユースケース: UC01
    エンティティ: 書籍
    操作: CR

  # UC02 仕入先登録: 同じ名称の有無を確かめ (R)、仕入先を登録する (C)
  - ユースケース: UC02
    エンティティ: 仕入先
    操作: CR

  # UC03 入荷登録: 仕入先を選び、書籍を ISBN で引いて書名を出し、確定で入荷と
  # 明細を記録して在庫数を加算する。棚卸中なら確定を拒否する
  - ユースケース: UC03
    エンティティ: 書籍
    操作: RU
  - ユースケース: UC03
    エンティティ: 仕入先
    操作: R
  - ユースケース: UC03
    エンティティ: 入荷
    操作: C
  - ユースケース: UC03
    エンティティ: 入荷明細
    操作: C
  - ユースケース: UC03
    エンティティ: 棚卸
    操作: R

  # UC04 販売反映: 通知を販売と明細として記録し、書籍を ISBN で引いて在庫数を
  # 減算する。棚卸中なら通知の受付を拒否する
  - ユースケース: UC04
    エンティティ: 書籍
    操作: RU
  - ユースケース: UC04
    エンティティ: 販売
    操作: C
  - ユースケース: UC04
    エンティティ: 販売明細
    操作: C
  - ユースケース: UC04
    エンティティ: 棚卸
    操作: R

  # UC05 棚卸: 開始で棚卸と全書籍分の明細を作り (C)、実数の入力と確定で明細と
  # 棚卸の状態を更新し (U)、書籍の在庫数を実数に置き換える (U)
  - ユースケース: UC05
    エンティティ: 書籍
    操作: RU
  - ユースケース: UC05
    エンティティ: 棚卸
    操作: CU
  - ユースケース: UC05
    エンティティ: 棚卸明細
    操作: CU

  # UC06 在庫照会: 書籍と在庫数を検索し、選んだ書籍の入荷・販売・棚卸の履歴を
  # 表示する。何も書き換えない
  - ユースケース: UC06
    エンティティ: 書籍
    操作: R
  - ユースケース: UC06
    エンティティ: 入荷
    操作: R
  - ユースケース: UC06
    エンティティ: 入荷明細
    操作: R
  - ユースケース: UC06
    エンティティ: 販売
    操作: R
  - ユースケース: UC06
    エンティティ: 販売明細
    操作: R
  - ユースケース: UC06
    エンティティ: 棚卸
    操作: R
  - ユースケース: UC06
    エンティティ: 棚卸明細
    操作: R
