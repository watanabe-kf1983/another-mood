# 並び順はリソース系 (書籍 / 仕入先) を先に、イベント系をその作成順
# (入荷 → 販売 → 棚卸) に並べる。エンティティ一覧と CRUD マトリクスの列は
# この順で描く。ID は名前と同じ自然語キー (文書に出す識別子は名前で足りる)。
#
# 持ち方は設計書の設計方針節の判断に従う。在庫数を書籍の属性に持つ (D01)、
# 入荷・販売・棚卸を追記のみのイベントとして持つ (D02)、書籍の主キーを ISBN に
# し他からの参照も ISBN にする (D03)、未登録 ISBN の販売を保留として保存する
# (D04)、棚卸中を棚卸の状態として持つ (D05)、日時はローカル時刻 (D06)。
#
# 論理型は string / integer / datetime の 3 語。DDL 型 (VARCHAR(13) 等) は
# 物理設計の領分で、本書では扱わない。
#
# データストア は、そのエンティティが実装する業務モデルの台帳・記録。在庫数を書籍の
# 属性に持つ (D01) ので、書籍 は 書籍台帳 と 在庫台帳 の両方を実装する。イベント系は
# 親と明細の二つで 1 つの記録を実装する。
エンティティ:
  書籍:
    名前: 書籍
    説明: 本システムが在庫として扱う商品。ISBN を持つ出版物 1 種を 1 レコードとし、現在の在庫数を属性として保持する。
    種別: リソース
    用語: 書籍
    データストア:
      - ID: 書籍台帳
      - ID: 在庫台帳
    属性:
      - 名前: ISBN
        型: string
        必須: true
        主キー: true
        説明: 書籍を識別する 13 桁の番号。他のエンティティからの参照もこの値で行う。
      - 名前: 書名
        型: string
        必須: true
        説明: 書籍の表題。書籍の検索の対象になる。
      - 名前: 出版社
        型: string
        必須: true
        説明: 書籍の発行元の名称。
      - 名前: 在庫数
        型: integer
        必須: true
        説明: 店舗が現に保有する冊数。入荷で加算され、販売で減算され、棚卸で実数に置き換わる。

  仕入先:
    名前: 仕入先
    説明: 店舗に書籍を納入する取次や出版社。入荷の相手先として選ばれる。
    種別: リソース
    用語: 仕入先
    データストア:
      - ID: 仕入先台帳
    属性:
      - 名前: 仕入先ID
        型: string
        必須: true
        主キー: true
        説明: 仕入先を識別する番号。
      - 名前: 名称
        型: string
        必須: true
        説明: 取次や出版社の名称。
      - 名前: 連絡先
        型: string
        説明: 発注や問い合わせに用いる電話番号またはメールアドレス。

  入荷:
    名前: 入荷
    説明: 1 つの仕入先から届いた書籍を受け入れた記録。確定後は変更も削除もせず、届いた書籍と数量は明細に持つ。
    種別: イベント
    用語: 入荷
    データストア:
      - ID: 入荷記録
    属性:
      - 名前: 入荷ID
        型: string
        必須: true
        主キー: true
        説明: 1 回の入荷を識別する番号。
      - 名前: 入荷日時
        型: datetime
        必須: true
        説明: 入荷を確定し、在庫数に加算した日時。
      - 名前: 仕入先ID
        型: string
        必須: true
        説明: 書籍を納入した仕入先。
        参照:
          エンティティ: 仕入先
          属性: 仕入先ID

  入荷明細:
    名前: 入荷明細
    説明: 1 回の入荷で届いた書籍と数量の 1 行。入荷の確定時に、この数量が書籍の在庫数に加算される。
    種別: イベント
    データストア:
      - ID: 入荷記録
    属性:
      - 名前: 入荷ID
        型: string
        必須: true
        主キー: true
        説明: 明細が属する入荷。
        参照:
          エンティティ: 入荷
          属性: 入荷ID
      - 名前: 行番号
        型: integer
        必須: true
        主キー: true
        説明: 入荷の中での明細の通し番号。
      - 名前: ISBN
        型: string
        必須: true
        説明: 届いた書籍。入荷登録では未登録の ISBN を明細に加えられない。
        参照:
          エンティティ: 書籍
          属性: ISBN
      - 名前: 数量
        型: integer
        必須: true
        説明: 届いた冊数。

  販売:
    名前: 販売
    説明: 決済サービスから受け取った販売通知 1 件の記録。通知の内容をまず保存し、在庫への反映はその後に行う。
    種別: イベント
    用語: 販売
    データストア:
      - ID: 販売記録
    属性:
      - 名前: 販売ID
        型: string
        必須: true
        主キー: true
        説明: 1 件の販売通知を識別する番号。
      - 名前: 通知日時
        型: datetime
        必須: true
        説明: 決済サービスから通知を受け取り、受領を返した日時。
      - 名前: 状態
        型: string
        必須: true
        説明: 確定 (在庫数への反映済み) または 保留 (未登録の書籍を含み、店員の確認待ち)。

  販売明細:
    名前: 販売明細
    説明: 1 件の販売通知に含まれる書籍と数量の 1 行。通知された ISBN をそのまま残し、登録済みの書籍への対応付けは別に持つ。
    種別: イベント
    データストア:
      - ID: 販売記録
    属性:
      - 名前: 販売ID
        型: string
        必須: true
        主キー: true
        説明: 明細が属する販売。
        参照:
          エンティティ: 販売
          属性: 販売ID
      - 名前: 行番号
        型: integer
        必須: true
        主キー: true
        説明: 販売通知の中での明細の通し番号。
      - 名前: 通知ISBN
        型: string
        必須: true
        説明: 決済サービスから通知された ISBN。未登録の ISBN もそのまま記録する。
      - 名前: ISBN
        型: string
        説明: 通知ISBN に対応する登録済みの書籍。未登録なら空で、店員の確認によって埋まる。
        参照:
          エンティティ: 書籍
          属性: ISBN
      - 名前: 数量
        型: integer
        必須: true
        説明: 売れた冊数。

  棚卸:
    名前: 棚卸
    説明: 全書籍を数えて在庫数を実数に合わせた 1 回の記録。開始から確定までの間、システムは棚卸中の状態に置かれる。
    種別: イベント
    用語: 棚卸
    データストア:
      - ID: 棚卸記録
    属性:
      - 名前: 棚卸ID
        型: string
        必須: true
        主キー: true
        説明: 1 回の棚卸を識別する番号。
      - 名前: 開始日時
        型: datetime
        必須: true
        説明: 棚卸を開始し、その時点の在庫数を基準として記録した日時。
      - 名前: 確定日時
        型: datetime
        説明: 在庫数を実数に置き換えて棚卸を確定した日時。確定前は空。
      - 名前: 状態
        型: string
        必須: true
        説明: 棚卸中 (実数の入力中) または 確定。棚卸中の間は入荷の確定と販売通知の受付を拒否する。

  棚卸明細:
    名前: 棚卸明細
    説明: 1 回の棚卸における書籍 1 種の記録。開始時点の在庫数を基準として残し、数えた実数との差異を確定時に記録する。
    種別: イベント
    データストア:
      - ID: 棚卸記録
    属性:
      - 名前: 棚卸ID
        型: string
        必須: true
        主キー: true
        説明: 明細が属する棚卸。
        参照:
          エンティティ: 棚卸
          属性: 棚卸ID
      - 名前: ISBN
        型: string
        必須: true
        主キー: true
        説明: 数えた対象の書籍。棚卸の開始時に全書籍分の明細が作られる。
        参照:
          エンティティ: 書籍
          属性: ISBN
      - 名前: 基準在庫数
        型: integer
        必須: true
        説明: 棚卸の開始時点でシステムが保持していた在庫数。
      - 名前: 実数
        型: integer
        説明: 店員が数えた冊数。入力前は空。
      - 名前: 差異
        型: integer
        説明: 実数から基準在庫数を引いた数。棚卸の確定時に記録する。
