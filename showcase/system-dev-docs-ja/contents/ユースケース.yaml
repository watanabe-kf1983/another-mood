# 並び順は業務の時系列 (マスタ登録 → 入荷 → 販売 → 棚卸 → 照会)。
# 要求仕様書の主要機能と機能要求の節、設計書の CRUD マトリクスの行はこの順で描く。
ユースケース:
  UC01:
    名前: 書籍登録
    概要: 新たに取り扱う書籍を ISBN で登録する。登録した書籍が在庫の対象になる。
    アクター:
      - ID: 店員
    事前条件: 登録する書籍の ISBN が分かっている。
    事後条件: 書籍が登録され、在庫数 0 の在庫として管理の対象になっている。
    基本シナリオ:
      - 操作: 書籍の ISBN を入力する。
        応答: ISBN の形式を検査し、書名と出版社の入力を受け付ける。
        例外:
          - 条件: ISBN の形式が正しくない。
            応答: 誤りを示し、再入力を促す。
          - 条件: 同じ ISBN の書籍が既に登録されている。
            応答: 登録済みの書籍を示し、登録を中止する。
      - 操作: 書名と出版社を入力し、登録を確定する。
        応答: 書籍を登録し、その書籍の在庫数を 0 として在庫に加える。
  UC02:
    名前: 仕入先登録
    概要: 入荷の相手先となる仕入先を登録する。
    アクター:
      - ID: 店員
    事後条件: 仕入先が登録され、入荷登録の相手先として選べる。
    基本シナリオ:
      - 操作: 仕入先の名称と連絡先を入力し、登録を確定する。
        応答: 仕入先を登録し、入荷の相手先の一覧に加える。
        例外:
          - 条件: 同じ名称の仕入先が既に登録されている。
            応答: 既存の仕入先を示し、そのまま登録するか中止するかを問う。
  UC03:
    名前: 入荷登録
    概要: 仕入先から届いた書籍と数量を記録し、在庫を加算する。
    アクター:
      - ID: 店員
    事前条件: 入荷の相手先の仕入先と、届いた書籍が登録済みである。
    事後条件: 入荷が記録され、各書籍の在庫数に入荷数量が加算されている。
    基本シナリオ:
      - 操作: 仕入先を選ぶ。
        応答: 選ばれた仕入先を入荷の相手先として保持し、書籍の入力を受け付ける。
      - 操作: 届いた書籍を ISBN で指定し、数量を入力する。
        応答: 書名を表示し、入荷の明細に加える。
        例外:
          - 条件: ISBN が未登録である。
            応答: 明細への追加を拒否し、先に書籍登録を行うよう促す。
      - 操作: 入荷を確定する。
        応答: 入荷を記録し、明細の各書籍の在庫数に数量を加算する。
  UC04:
    名前: 販売反映
    概要: 決済サービスから確定した販売の書籍と数量を受け取り、在庫を減算する。
    アクター:
      - ID: 決済サービス
    事前条件: 販売された書籍が登録済みである。
    事後条件: 販売が記録され、各書籍の在庫数から販売数量が減算されている。
    基本シナリオ:
      - 操作: 確定した販売の書籍 (ISBN) と数量を通知する。
        応答: 販売を記録し、各書籍の在庫数から数量を減算して、受領を返す。
        例外:
          - 条件: 通知された ISBN が未登録である。
            応答: 販売を保留として記録し、店員に書籍の確認を求める。
          - 条件: 在庫数が販売数量に満たない。
            応答: 在庫数を減算したうえで、その書籍を要確認として店員に知らせる。
  UC05:
    名前: 棚卸
    概要: 数えた実数を記録して在庫を実数に合わせ、差異を棚卸の記録として残す。
    アクター:
      - ID: 店員
    事前条件: 閉店後で、入荷登録と販売反映が行われない状態である。
    事後条件: 各書籍の在庫数が実数に合わせられ、差異が棚卸の記録として残っている。
    基本シナリオ:
      - 操作: 棚卸を開始する。
        応答: 全書籍の現在の在庫数を棚卸の基準として記録し、実数の入力を受け付ける。
      - 操作: 書籍ごとに数えた実数を入力する。
        応答: 基準の在庫数との差異を書籍ごとに表示する。
      - 操作: 棚卸を確定する。
        応答: 各書籍の在庫数を実数に置き換え、差異を棚卸の記録として保存する。
        例外:
          - 条件: 実数が未入力の書籍がある。
            応答: 確定を拒否し、未入力の書籍を示す。
  UC06:
    名前: 在庫照会
    概要: 書籍ごとの現在の在庫数を参照する。
    アクター:
      - ID: 店員
      - ID: 店主
    事後条件: 在庫は変更されない。
    基本シナリオ:
      - 操作: 書名または ISBN で書籍を検索する。
        応答: 該当する書籍と現在の在庫数を一覧する。
        例外:
          - 条件: 該当する書籍が無い。
            応答: 該当が無いことを示す。
      - 操作: 一覧から書籍を選ぶ。
        応答: その書籍の入荷・販売・棚卸の履歴を表示する。
