# 並び順は業務の時系列 (マスタ登録 → 入荷 → 販売 → 棚卸 → 照会)。
# 要求仕様書の主要機能、設計書の機能一覧と CRUD マトリクスの行はこの順で描く。
ユースケース:
  UC01:
    名前: 書籍登録
    概要: 新たに取り扱う書籍を ISBN で登録する。登録した書籍が在庫の対象になる。
    アクター:
      - ID: 店員
  UC02:
    名前: 仕入先登録
    概要: 入荷の相手先となる仕入先を登録する。
    アクター:
      - ID: 店員
  UC03:
    名前: 入荷登録
    概要: 仕入先から届いた書籍と数量を記録し、在庫を加算する。
    アクター:
      - ID: 店員
  UC04:
    名前: 販売反映
    概要: 決済サービスから確定した販売の書籍と数量を受け取り、在庫を減算する。
    アクター:
      - ID: 決済サービス
  UC05:
    名前: 棚卸
    概要: 数えた実数を記録して在庫を実数に合わせ、差異を棚卸の記録として残す。
    アクター:
      - ID: 店員
      - ID: 店主
  UC06:
    名前: 在庫照会
    概要: 書籍ごとの現在の在庫数を参照する。
    アクター:
      - ID: 店員
      - ID: 店主
