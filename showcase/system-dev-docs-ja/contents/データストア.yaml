# 業務モデルのデータストア (業務が読み書きする台帳・記録)。設計書の論理データ
# モデルのエンティティはこれを実装する。ID は表示名と同じ。
データストア:
  書籍台帳:
    名前: 書籍台帳
    説明: 取り扱う書籍の一覧。ISBN、書名、出版社を持つ。
  仕入先台帳:
    名前: 仕入先台帳
    説明: 取引のある仕入先の一覧。名称と連絡先を持つ。
  在庫台帳:
    名前: 在庫台帳
    説明: 書籍ごとの現在の在庫数。
  入荷記録:
    名前: 入荷記録
    説明: 仕入先から届いた書籍と数量の記録。
  販売記録:
    名前: 販売記録
    説明: 確定した販売と、確認待ちの保留の販売の記録。
  棚卸記録:
    名前: 棚卸記録
    説明: 棚卸ごとの、書籍別の帳簿上の在庫数と実数の差異の記録。
