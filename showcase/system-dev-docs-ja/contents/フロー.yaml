    説明: 発注する書籍と数量。
    元: { プロセス: P0 }
    先: { 外部エンティティ: 仕入先 }
  F04:
    名前: 納品
    説明: 届いた書籍と納品書。
    元: { 外部エンティティ: 仕入先 }
    先: { プロセス: P0 }

