# 業務モデルのデータフロー。レベルごとに記録し、下位のフローは 親 で自分を束ねる
# 上位のフローを指す (図の中で閉じるフローと、コンテキスト図のフローは 親 を
# 持たない)。同じ名前のフローが各レベルに現れるのはそのため。
#
# 元 / 先 は プロセス / データストア / 外部エンティティ のいずれか 1 つ。
# 並びはレベル順、同じレベルでは親プロセスごとにまとめる。
フロー:
