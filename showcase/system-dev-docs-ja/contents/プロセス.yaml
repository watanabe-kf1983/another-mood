# 業務モデル (階層 DFD) のプロセス。親 を持たない P0 が業務全体 (コンテキスト図の
# 唯一のプロセス)、その子 (P1〜P3) がレベル 1、孫 (P11〜P32) がレベル 2 の葉。
#
# 並び順は深さ優先 (親の直後にその子) で、文書のプロセス階層の掲載順になる。
# 番号もこの並びから決まる: 同じ親を持つプロセスの記述順が 1、2、3 になり、孫は
# 親の番号に続けて 1.1、1.2 となる。番号はデータに持たない (プロセスを差し込めば
# 後続の番号は自然にずれる)。ID は識別子であって番号ではない。
プロセス:
  P0:
    名前: 書店の業務
    説明: 書籍の仕入から店頭での販売、在庫の管理までの店舗の業務全体。本システムはこのうちの一部を支える。
  P1:
    名前: 仕入
    説明: 仕入先への発注と、納品された書籍の受け入れ。取り扱う書籍と仕入先の登録もここで行う。
    親: P0
  P11:
    名前: 発注する
    説明: 在庫の少ない書籍を選び、仕入先に発注する。
    親: P1
  P12:
    名前: 入荷を登録する
    説明: 納品された書籍と数量を納品書と突き合わせて記録し、在庫に加える。
    親: P1
  P13:
    名前: 書籍を登録する
    説明: 新たに取り扱う書籍を ISBN で台帳に登録する。
    親: P1
  P14:
    名前: 仕入先を登録する
    説明: 新たに取引する仕入先を台帳に登録する。
    親: P1
  P2:
    名前: 販売
    説明: 顧客への会計と、確定した販売の記録。
    親: P0
  P21:
    名前: 会計する
    説明: 顧客が選んだ書籍の代金を受け取り、レシートを渡す。
    親: P2
  P22:
    名前: 販売を記録する
    説明: 確定した販売の書籍と数量を記録し、在庫から引く。台帳に無い書籍を含む販売は保留として記録する。
    親: P2
  P23:
    名前: 保留販売を確認する
    説明: 保留になった販売の書籍を台帳の書籍に対応付け、販売を確定して在庫から引く。
    親: P2
  P3:
    名前: 在庫管理
    説明: 在庫の実数の確認と、在庫の照会。
    親: P0
  P31:
    名前: 棚卸する
    説明: 閉店後に全書籍の実数を数え、在庫を実数に合わせて差異を記録する。
    親: P3
  P32:
    名前: 在庫を照会する
    説明: 書籍ごとの現在の在庫数を調べる。
    親: P3
