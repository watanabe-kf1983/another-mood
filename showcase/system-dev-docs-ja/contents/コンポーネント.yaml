# 並び順は依存の向きの逆 (呼ばれる側から)。書籍 と 在庫 が土台で、入荷・販売・棚卸
# の三つがその上に乗る。ID は連番 (C = component)。
#
# 分解の粒度は業務の単位で、サブシステム分割に当たる。在庫 だけは業務ではなく、
# 在庫数を動かす唯一の経路として切り出した横断の部品 (D07)。設計判断 は「その判断を
# どのコンポーネントが引き受けるか」で、全体に及ぶ判断 (D06、D08) はどこにも置かない。
コンポーネント:
  C01:
    名前: 書籍
    責務: 書籍の登録と検索を担い、他のコンポーネントが ISBN で書籍を引く入口になる。書籍の識別子は ISBN であり、独自の番号を持たない。
    ユースケース:
      - ID: UC01
    エンティティ:
      - ID: 書籍
    設計判断:
      - ID: D03
  C02:
    名前: 在庫
    責務: 在庫数を動かす唯一の経路。入荷・販売・棚卸はここを通してだけ在庫数を加減算し、棚卸の状態が棚卸中の間は加減算を拒否する。在庫の照会と、書籍ごとの変動履歴の表示もここが担い、履歴は入荷・販売・棚卸の記録とその明細を読み取りだけで参照する。
    依存:
      - ID: C01
    ユースケース:
      - ID: UC06
    エンティティ:
      - ID: 書籍
      - ID: 入荷
      - ID: 入荷明細
      - ID: 販売
      - ID: 販売明細
      - ID: 棚卸
      - ID: 棚卸明細
    設計判断:
      - ID: D01
      - ID: D05
      - ID: D07
  C03:
    名前: 入荷
    責務: 仕入先を登録し、仕入先からの入荷を明細とともに記録して、確定時に在庫数を加算する。確定後の変更と削除は設けない。
    依存:
      - ID: C01
      - ID: C02
    ユースケース:
      - ID: UC02
      - ID: UC03
    エンティティ:
      - ID: 入荷
      - ID: 入荷明細
      - ID: 仕入先
    設計判断:
      - ID: D02
  C04:
    名前: 販売
    責務: 決済サービスからの販売通知を受領して販売を記録し、在庫数を減算する。未登録の書籍を含む通知は保留として残し、店員の確認で登録済みの書籍に結び付ける。
    依存:
      - ID: C01
      - ID: C02
    ユースケース:
      - ID: UC04
      - ID: UC07
    エンティティ:
      - ID: 販売
      - ID: 販売明細
    設計判断:
      - ID: D02
      - ID: D04
  C05:
    名前: 棚卸
    責務: 棚卸の開始から確定までを記録し、確定時に実数で在庫数を置き換える。開始と確定で棚卸の状態 (棚卸中 / 確定) を切り替え、在庫はこれを見て加減算を拒否する。
    依存:
      - ID: C01
      - ID: C02
    ユースケース:
      - ID: UC05
    エンティティ:
      - ID: 棚卸
      - ID: 棚卸明細
    設計判断:
      - ID: D02
