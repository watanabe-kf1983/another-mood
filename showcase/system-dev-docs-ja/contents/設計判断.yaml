# 並び順は掲載順。データの持ち方 (D01–D03) から業務の扱い (D04–D05)、慣行 (D06)、
# ソフトウェアの構成 (D07–D08) の順に並べる。ID は連番。根拠要求 は要求仕様書の
# 要求 ID を指し、要求に由来しない判断 (D06) では持たない。
設計判断:
  D01:
    題名: 在庫数は履歴から導出せず実数で持つ
    判断: 書籍ごとの在庫数を書籍の属性として保持し、入荷・販売・棚卸の確定のたびにその値を加減算する。
    理由: 在庫照会のたびに入荷・販売・棚卸の履歴を集計すると、履歴が増えるほど応答が遅くなる。履歴は保持するが (D02)、在庫数の正本は実数の側に置き、履歴は原因調査に用いる。
    根拠要求:
      - ID: R04
      - ID: R06
      - ID: R09
      - ID: R16
  D02:
    題名: 在庫変動は追記のみのイベントとして記録する
    判断: 入荷・販売・棚卸をそれぞれイベント系のエンティティとして持ち、確定後の変更と削除の操作を設けない。誤りの訂正は逆方向のイベント (棚卸による置き換えなど) で行う。
    理由: 在庫の食い違いを調べるには、何がいつ在庫を動かしたかがそのまま残っている必要がある。訂正のための更新・削除を許すと記録の保全が崩れるので、訂正も一つのイベントとして残す形に統一した。
    根拠要求:
      - ID: R10
      - ID: R13
      - ID: R18
  D03:
    題名: 書籍の主キーは ISBN とし、代理キーを置かない
    判断: 書籍エンティティの主キーを ISBN にし、システム独自の連番の書籍番号は持たない。他のエンティティから書籍を参照する外部キーも ISBN にする。
    理由: 仕入先からの入荷と決済サービスからの販売通知はどちらも ISBN で書籍を指すので、ISBN を主キーにすれば対応表も変換も要らない。ISBN の再利用や訂正の可能性は、取り扱う書籍がすべて ISBN を持つという前提のもとで許容した。
    根拠要求:
      - ID: R02
      - ID: R20
  D04:
    題名: 販売通知は受領を先に返し、未登録書籍の販売は保留として保存する
    判断: 決済サービスからの販売通知は形式が正しければ即座に受領し、通知の内容をまず販売イベントとして保存してから在庫を減算する。未登録の ISBN を含む通知は保留の販売として保存し、店員の確認で登録済みの書籍に結び付ける。
    理由: 通知の処理で在庫の更新まで待たせると、店頭の決済を本システムの都合で遅らせることになる。通知を捨てても拒否しても販売が在庫に反映されないので、受領と反映を分け、反映できないものは保留として残す。
    根拠要求:
      - ID: R07
      - ID: R14
      - ID: R21
  D05:
    題名: 棚卸中はシステム全体を棚卸中の状態に置く
    判断: 棚卸の開始から確定までを「棚卸中」というシステム全体の状態として持ち、この間は入荷の確定、販売通知の受付、および保留販売の確認の確定を拒否する。
    理由: 棚卸は閉店後に全数で行うので、書籍ごとに棚卸中かどうかを持つより、全体で一つの状態を持つほうが単純で、拒否の判定も一箇所で済む。営業中の部分棚卸は前提で除外されており、閉店後は販売通知も届かないので、通知を拒否しても決済を止めることにはならない。
    根拠要求:
      - ID: R11
  D06:
    題名: 日時は店舗のローカル時刻で持ち、タイムゾーンを持たない
    判断: 入荷・販売・棚卸の日時をすべて店舗の所在地のローカル時刻で記録し、タイムゾーンの情報は持たない。
    理由: 対象が単一店舗で、日時を読むのもその店舗の店員に限られる。タイムゾーンを持つと画面と記録の変換が要る一方で、得られる利点が無い。
  D07:
    題名: 在庫数の加減算は在庫コンポーネントだけが行う
    判断: 在庫数を加減算する処理と、棚卸中かどうかを見て加減算を拒否する判定を在庫コンポーネントに置く。入荷・販売・棚卸は在庫数を自分で書き換えず、確定時に在庫コンポーネントを呼んで加減算させる。
    理由: 在庫数の正本は実数なので (D01)、加減算の抜けや二重反映がそのまま在庫の食い違いになる。加減算の経路を一つにすれば、棚卸中の拒否 (D05) も同じ場所で守れ、入荷・販売・棚卸は互いを知らずに済む。
    根拠要求:
      - ID: R04
      - ID: R06
      - ID: R09
      - ID: R11
  D08:
    題名: コンポーネントはデータベースを共有し、イベントの記録を読むだけの参照は依存にしない
    判断: すべてのコンポーネントが一つのデータベースを共有する。エンティティの各属性への書き込みは、それを担う一つのコンポーネントに閉じる (書籍は登録を書籍コンポーネントが、在庫数を在庫コンポーネントが書く)。他のコンポーネントが記録したイベント (入荷・販売・棚卸とその明細) を読むだけの処理はデータベースを直接参照し、コンポーネント間の依存 (呼び出し) には数えない。書籍を ISBN で引く処理は書籍コンポーネントを呼ぶので、依存に数える。
    理由: 本システムは 1 台のサーバで動く一つの Web アプリケーションで、コンポーネントはその中のモジュールである。イベントの読み取りまで呼び出しにすると、在庫照会の変動履歴のように複数の業務の記録を横断する機能のために、土台の在庫が上に乗る入荷・販売・棚卸を呼ぶ循環が生じる。整合を守るのに要るのは書き込みの経路を閉じることだけなので、イベントの読み取りは共有データベース越しに許す。書籍の検索だけは、未登録の ISBN の判定を一箇所に置くために書籍コンポーネントを通す。
    根拠要求:
      - ID: R13
      - ID: R19
