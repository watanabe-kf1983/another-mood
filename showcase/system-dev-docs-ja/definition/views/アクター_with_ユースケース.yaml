# アクターから「関わるユースケース」を逆引きする。
# ユースケース.アクター[] (多対多をオブジェクト配列で包んだもの) を flatten で
# 1 行 1 (ユースケース, アクター) に展開し、アクター側からその ID で join する。
# join の on は入れ子のリストを跨げないため、先に flatten した view を挟む。
ユースケース_アクター:
  from: ユースケース
  flatten:
    of: アクター
    as: アクター
  select:
    - item: id
    - item: 名前
    - item: 概要
    - item: アクター

# 要求仕様書「利用者」「外部システム」の節のソース。アクターごとに、
# 関わるユースケースが ユースケース (配列) として付く。
アクター_with_ユースケース:
  from: アクター
  join:
    to: ユースケース_アクター
    on: { left: id, right: アクター.ID }
    as: ユースケース
  select:
    - item: id
    - item: 名前
    - item: 種別
    - item: 説明
    - item: ユースケース
