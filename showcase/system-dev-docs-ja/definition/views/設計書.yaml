# 設計書の木。要求仕様書.yaml と同じく、文書の中に描くものはすべてこの木の葉に
# コピーし、リンクもコピーへ張る。要求仕様書が描くもの (ユースケース、用語、要求)
# へのリンクは、要求仕様書の木のコピーへ張る。
#
# 設計書が読む prose レコードは名前が決まっていて、contents を差し替えるときも
# この名前で置く: 設計書/はじめに (1 章) は下の 文章 の view がコピーし、
# 設計書/論理データモデル・設計書/CRUDマトリクス・設計書/画面設計 (各節の注記) は
# 節のテンプレートが content のまま埋め込む。

# ---------------------------------------------------------------------------
# 1. はじめに
# ---------------------------------------------------------------------------

設計書.はじめに.文章:
  from: prose
  where:
    id: 設計書/はじめに

設計書.はじめに.設計方針:
  from: 設計判断

# ---------------------------------------------------------------------------
# 2. コンテキスト (章そのものが葉)
# ---------------------------------------------------------------------------

設計書.コンテキスト:
  from: ユースケース
  select:
    - item: id
    - item: 名前
    - item: アクター

# ---------------------------------------------------------------------------
# 3. データ設計
# ---------------------------------------------------------------------------

設計書.データ設計.論理データモデル:
  from: エンティティ

# CRUD マトリクスの行。view に pivot は無いので、列 (エンティティ) とセルの突合は
# テンプレートが担う。
設計書.データ設計.CRUDマトリクス:
  from: ユースケース
  join:
    to: データアクセス
    on: { left: id, right: ユースケース }
    as: アクセス
  select:
    - item: id
    - item: 名前
    - item: アクセス

# ---------------------------------------------------------------------------
# 4. 画面設計 (章そのものが葉)
# ---------------------------------------------------------------------------

設計書.画面設計:
  from: 画面
