# 要求仕様書の木。ドット区切りの名前で view を 要求仕様書 → 章 → 節 の位置に
# 置き、要求仕様書 と各章はそれを束ねるオブジェクトとしてデータ木のノードになる。
# テンプレートは文書と章をそれぞれ主題に取って render し、web edition では章、
# book edition では文書が 1 頁になる。
#
# 文書の中に描くものはすべてこの木の葉にコピーする。リンクの向き先の頁はデータ
# ツリー上の位置で決まるので、文書の頁から描いたものへのリンクは、その頁の
# 部分木にあるコピーへ張って初めて着地する (元のエンティティはどこにも描かれ
# ない)。prose も同じで、render の主題は this の部分木に限られるため、章の文章を
# 章の下にコピーして描く。

# ---------------------------------------------------------------------------
# 1. はじめに
# ---------------------------------------------------------------------------

要求仕様書.はじめに.文章:
  from: prose
  where:
    or:
      - id: 要求仕様書/はじめに
      - id: 要求仕様書/制約

# 業務コンテキストとシステム化範囲。葉プロセスの home はここ (システム化範囲の
# 表の行) になる。
要求仕様書.はじめに.業務コンテキスト:
  from: プロセス

要求仕様書.はじめに.主要機能:
  from: ユースケース

# 「利用者」「外部システム」の節のソース。アクターごとに、関わるユースケースが
# ユースケース (配列) として付く。
要求仕様書.はじめに.利用者と外部システム:
  from: アクター
  join:
    to: ユースケース_アクター
    on: { left: id, right: アクター.ID }
    as: ユースケース
  select:
    - item: id
    - item: 名前
    - item: 種別
    - item: 説明
    - item: ユースケース

# ---------------------------------------------------------------------------
# 2. 用語集 (章そのものが葉)
# ---------------------------------------------------------------------------

要求仕様書.用語集:
  from: 用語

# ---------------------------------------------------------------------------
# 3. 要求
# ---------------------------------------------------------------------------

# 機能要求のユースケース記述。ユースケースに、そのユースケースに属する要求
# (要求.ユースケース が一致するもの) を 要求 (配列) として join する。
#
# ユースケース記述は web edition で 1 件 1 頁に割る。join でユースケース行の配下に
# 要求のコピーを載せると、コピーの anchor path
# (/要求仕様書/要求/機能要求/UC03/要求/R04) がその頁を指す。ユースケースの home は
# この view の行で、他章からのリンクは node("要求仕様書", "要求", "機能要求", id)
# で張る。
要求仕様書.要求.機能要求:
  from: ユースケース
  join:
    to: 要求
    on: { left: id, right: ユースケース }
    as: 要求
  select:
    - item: id
    - item: 名前
    - item: 概要
    - item: アクター
    - item: 業務プロセス
    - item: 事前条件
    - item: 事後条件
    - item: 基本シナリオ
    - item: 要求

# 非機能要求の種別ごとの節。機能要求以外の要求を種別でグループ化し、種別の値を
# 行の id にする (行 = 節、配下の 要求 = その節の要求)。節の順は contents の
# 記述順 (外部インタフェース → 品質 → 設計制約)。機能要求と同じ理由で、要求の
# コピーを節の行の配下に載せる (/要求仕様書/要求/非機能要求/品質/要求/R16)。
要求仕様書.要求.非機能要求:
  from: 要求
  where:
    not:
      種別: 機能
  grouped:
    by: 種別
    as: 要求
  select:
    - item: 種別
      as: id
    - item: 要求

# ---------------------------------------------------------------------------
# 4. 検証
# ---------------------------------------------------------------------------

# 3 章と同じ行を、検証方法 / 適合基準 の列で描き直すためのコピー。章を 1 頁に
# 割るには、章が自分の部分木を持たなければならない。要求の home は 3 章のまま
# で、4 章の ID 列はそちらへリンクする。
要求仕様書.検証.機能要求:
  from: 要求仕様書.要求.機能要求

要求仕様書.検証.非機能要求:
  from: 要求仕様書.要求.非機能要求

# ---------------------------------------------------------------------------
# 5. 付録
# ---------------------------------------------------------------------------

要求仕様書.付録.文章:
  from: prose
  where:
    id: 要求仕様書/付録

# 業務モデルの分解図。分解されているプロセス (子を持つプロセス) ごとに 1 行で、
# id = 親プロセスの ID、子 = その子プロセスの並び。描く単位が「1 プロセスの
# 分解 = 1 図」なので、プロセス entity ではなく図の単位を行にする。親プロセス
# 自身の名前は node("プロセス", id) で引く。行の順は 親 の初出順で、プロセス.yaml
# が深さ優先に並んでいるので 図 0、図 1、図 2、… になる。
要求仕様書.付録.業務モデル:
  from: プロセス
  where:
    親: { exists: true }
  grouped:
    by: 親
    as: 子
  select:
    - item: 親
      as: id
    - item: 子
