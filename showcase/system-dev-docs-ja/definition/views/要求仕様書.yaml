# 要求仕様書の木。文書の中に描くものはすべてこの木の葉にコピーし、リンクもコピーへ
# 張る: リンクの着地先はデータ木上の位置で決まるので、元のエンティティ (どこにも
# 描かれない) へ張っても着地しない。prose も同じで、章の文章は章の下にコピーする。
#
# 要求仕様書が読む prose レコードは名前が決まっていて、contents を差し替えるときも
# この名前で置く: 要求仕様書/はじめに と 要求仕様書/制約 (1 章)、要求仕様書/付録
# (5 章) は下の 文章 の view がコピーし、要求仕様書/業務モデル (5 章の業務モデルの
# 節の注記) は節のテンプレートが content のまま埋め込む。

# ---------------------------------------------------------------------------
# 1. はじめに
# ---------------------------------------------------------------------------

要求仕様書.はじめに.文章:
  from: prose
  where:
    or:
      - id: 要求仕様書/はじめに
      - id: 要求仕様書/制約

要求仕様書.はじめに.業務コンテキスト:
  from: プロセス

要求仕様書.はじめに.主要機能:
  from: ユースケース

要求仕様書.はじめに.利用者と外部システム:
  from: アクター
  join:
    to: ユースケース_アクター
    on: { left: id, right: アクター.ID }
    as: ユースケース
  select:
    - item: id
    - item: 名前
    - item: 種別
    - item: 説明
    - item: ユースケース

# ---------------------------------------------------------------------------
# 2. 用語集 (章そのものが葉)
# ---------------------------------------------------------------------------

要求仕様書.用語集:
  from: 用語

# ---------------------------------------------------------------------------
# 3. 要求
# ---------------------------------------------------------------------------

# 要求のコピーをユースケース行の配下に載せるのは、要求の anchor path
# (/要求仕様書/要求/機能要求/UC03/要求/R04) が web edition のユースケースの頁を
# 指すようにするため。ユースケースと要求の home はここ。
要求仕様書.要求.機能要求:
  from: ユースケース
  join:
    to: 要求
    on: { left: id, right: ユースケース }
    as: 要求
  select:
    - item: id
    - item: 名前
    - item: 概要
    - item: アクター
    - item: 業務プロセス
    - item: 事前条件
    - item: 事後条件
    - item: 基本シナリオ
    - item: 要求

# 機能要求と同じ理由で、要求のコピーを種別の行の配下に載せる
# (/要求仕様書/要求/非機能要求/品質/要求/R16)。
要求仕様書.要求.非機能要求:
  from: 要求
  where:
    not:
      種別: 機能
  grouped:
    by: 種別
    as: 要求
  select:
    - item: 種別
      as: id
    - item: 要求

# ---------------------------------------------------------------------------
# 4. 検証
# ---------------------------------------------------------------------------

# 3 章と同じ行を、検証方法 / 適合基準 の列で描き直すためのコピー。章を 1 頁に
# 割るには、章が自分の部分木を持たなければならない。要求の home は 3 章のまま
# で、4 章の ID 列はそちらへリンクする。
要求仕様書.検証.機能要求:
  from: 要求仕様書.要求.機能要求

要求仕様書.検証.非機能要求:
  from: 要求仕様書.要求.非機能要求

# ---------------------------------------------------------------------------
# 5. 付録
# ---------------------------------------------------------------------------

要求仕様書.付録.文章:
  from: prose
  where:
    id: 要求仕様書/付録

# 描く単位は「1 プロセスの分解 = 1 図」なので、プロセスではなく図を行にする
# (id = 親プロセスの ID、子 = その子プロセス)。行の順は 親 の初出順で、プロセス.yaml
# が深さ優先に並んでいることに依って 図 0、図 1、図 2、… になる。
要求仕様書.付録.業務モデル:
  from: プロセス
  where:
    親: { exists: true }
  grouped:
    by: 親
    as: 子
  select:
    - item: 親
      as: id
    - item: 子
