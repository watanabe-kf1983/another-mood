# 要求仕様書 3 章「機能要求」のユースケース記述のソース。ユースケースに、
# そのユースケースに属する要求 (要求.ユースケース が一致するもの) を 要求 (配列)
# として join する。
#
# ユースケース記述は web edition で 1 件 1 頁に割るが、リンクの向き先の頁は
# データツリー上の位置で決まるので、トップレベルの 要求 をユースケースの頁に
# 描いてもそこへのリンクは着地しない。join でユースケース行の配下に要求の
# コピーを載せると、コピーの anchor path (/ユースケース記述/UC03/要求/R04) が
# その頁を指す。ユースケースの home はこの view の行で、他章からのリンクは
# node("ユースケース記述", id) で張る。
ユースケース記述:
  from: ユースケース
  join:
    to: 要求
    on: { left: id, right: ユースケース }
    as: 要求
  select:
    - item: id
    - item: 名前
    - item: 概要
    - item: アクター
    - item: 業務プロセス
    - item: 事前条件
    - item: 事後条件
    - item: 基本シナリオ
    - item: 要求
