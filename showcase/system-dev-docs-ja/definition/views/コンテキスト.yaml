# 設計書「コンテキスト」章の主題。章を 1 ページとして割るために、章が描く
# ユースケース (境界の中のノードと、アクターとの線) を章専用のビューとして立てる。
# ユースケース entity をそのまま主題にはできない: 要求仕様書 1 章の主要機能が
# 既に render していて主題の anchor が重複し、file_per の分割もそちらに及ぶ。
# 境界の外のアクターは node("アクター") で引く (サブテンプレートからトップレベルの
# 名前空間は見えないが、node() は届く)。
コンテキスト:
  from: ユースケース
  select:
    - item: id
    - item: 名前
    - item: アクター
