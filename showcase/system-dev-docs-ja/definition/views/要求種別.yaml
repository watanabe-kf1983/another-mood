# 要求仕様書 3 章「非機能要求」の種別ごとの節のソース。機能要求以外の要求を
# 種別でグループ化し、種別の値を行の id にする (行 = 節、配下の 要求 = その節の要求)。
# 節の順は contents の記述順 (外部インタフェース → 品質 → 設計制約)。
#
# ユースケース記述 と同じ理由で、要求のコピーを節の行の配下に載せる: web edition
# で節を 1 頁に割っても、要求の anchor path (/要求種別/品質/要求/R16) がその頁を指す。
要求種別:
  from: 要求
  where:
    not:
      種別: 機能
  grouped:
    by: 種別
    as: 要求
  select:
    - item: 種別
      as: id
    - item: 要求
