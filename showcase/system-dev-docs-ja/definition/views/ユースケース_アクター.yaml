# アクターから「関わるユースケース」を逆引きするための中間の view (要求仕様書
# 1 章「利用者と外部システム」が join する)。ユースケース.アクター[] (多対多を
# オブジェクト配列で包んだもの) を flatten で 1 行 1 (ユースケース, アクター) に
# 展開し、アクター側からその ID で join できる形にする。join の on は入れ子の
# リストを跨げないため、先に flatten した view を挟む。どこにも描かないので
# 文書の木の外に置く。
ユースケース_アクター:
  from: ユースケース
  flatten:
    of: アクター
    as: アクター
  select:
    - item: id
    - item: 名前
    - item: 概要
    - item: アクター
