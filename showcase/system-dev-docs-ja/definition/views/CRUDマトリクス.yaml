# 設計書「CRUD マトリクス」節の主題。ユースケース (行) に、そのユースケースの
# データアクセス (ユースケース が一致する行) を アクセス (配列) として join する。
# 列 (エンティティ) は主題の外なので、テンプレートが node("エンティティ") で引き、
# セルはテンプレートが行の アクセス から列のエンティティ ID で突合する
# (view には pivot が無い)。ユースケース entity をそのまま主題にはできない:
# 要求仕様書 1 章の主要機能が既に render している (コンテキスト と同じ理由)。
CRUDマトリクス:
  from: ユースケース
  join:
    to: データアクセス
    on: { left: id, right: ユースケース }
    as: アクセス
  select:
    - item: id
    - item: 名前
    - item: アクセス
