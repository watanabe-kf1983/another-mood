# 要求仕様書 付録「業務モデル」の主題。分解されているプロセス (子を持つプロセス)
# ごとに 1 行で、id = 親プロセスの ID、子 = その子プロセスの並び。描く単位が
# 「1 プロセスの分解 = 1 図」なので、プロセス entity ではなく図の単位を行にする。
# 親プロセス自身の名前は node("プロセス", id) で引く。行の順は 親 の初出順で、
# プロセス.yaml が深さ優先に並んでいるので 図 0、図 1、図 2、… になる。
分解図:
  from: プロセス
  where:
    親: { exists: true }
  grouped:
    by: 親
    as: 子
  select:
    - item: 親
      as: id
    - item: 子
