# Report output configuration. See the Another Mood docs on paging.
#
# This report ships two editions (form B): each is published side by side
# under output/{edition}/ and renders the same data, differing only in
# `file_per` (which ObjectType IDs are split into their own pages).
#
#   web  — browse online: the glossary (the 用語 collection) and each
#          use-case description (a ユースケース記述 view row: the use case
#          with its requirements joined), each non-functional section
#          (a 要求種別 view row: one requirement kind with its requirements),
#          the design policy section (the 設計判断 collection), the design
#          document's context chapter (the コンテキスト view, a chapter-sized
#          collection of its own) and the logical data model section (the
#          エンティティ collection: the ER diagram and entity list on one page,
#          each entity definition on a page of its own) and the CRUD matrix
#          section (the CRUDマトリクス view: use cases with their data
#          accesses joined) and the screen design chapter (the 画面 collection:
#          the screen list and the transition diagram on one page) are split
#          into their own pages; both documents stay on index.md until
#          composite views let a document be a node of its own.
#   book — read as one bound document: empty file_per keeps everything
#          inlined into a single index.md.
#
# Prose chapters are not split in either edition: they are inlined where
# the document shell embeds them (`| render("prose.md")`), and the section
# notes (設計書/論理データモデル.md, 設計書/CRUDマトリクス.md) are embedded as
# content by their section templates. Neither is the verification chapter: it re-lists the chapter 3 requirements by looping over
# the same view rows, so its tables have no subject of their own and its ID
# links land on the chapter 3 copies.
editions:
  web:
    file_per:
      - 用語.item[]
      - ユースケース記述.item
      - 要求種別.item
      - 設計判断.item[]
      - コンテキスト.item[]
      - エンティティ.item[]
      - エンティティ.item
      - CRUDマトリクス.item[]
      - 画面.item[]
  book:
    file_per: []
