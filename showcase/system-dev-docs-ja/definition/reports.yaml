# Report output configuration. See the Another Mood docs on paging.
#
# This report ships two editions (form B): each is published side by side
# under output/{edition}/ and renders the same data, differing only in
# `file_per` (which ObjectType IDs are split into their own pages).
#
#   web  — browse online: the glossary (the 用語 collection) and each
#          use-case description (a ユースケース記述 view row: the use case
#          with its requirements joined) and each non-functional section
#          (a 要求種別 view row: one requirement kind with its requirements)
#          are split into their own pages; both documents stay on index.md until composite views
#          let a document be a node of its own.
#   book — read as one bound document: empty file_per keeps everything
#          inlined into a single index.md.
#
# Prose chapters are not split in either edition: they are inlined where
# the document shell embeds them (`| render("prose.md")`). Neither is the
# verification chapter: it re-lists the chapter 3 requirements by looping over
# the same view rows, so its tables have no subject of their own and its ID
# links land on the chapter 3 copies.
editions:
  web:
    file_per:
      - 用語.item[]
      - ユースケース記述.item
      - 要求種別.item
  book:
    file_per: []
